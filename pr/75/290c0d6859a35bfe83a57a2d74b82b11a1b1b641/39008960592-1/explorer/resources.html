<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my-infra / リソース一覧</title>
<style>body{font:15px system-ui;max-width:1100px;margin:30px auto;padding:0 18px}input{font:inherit;padding:10px;width:100%;box-sizing:border-box}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}table{width:100%;table-layout:fixed}a{color:#2459b5}small{color:#555}</style>
<a href="./">← 構成図</a><h1>リソース一覧</h1><p>Terraform・Kubernetes・NAS dataset・Tunnel hostnameから名前と参照元を自動抽出。Secretの値・環境変数・接続資格情報は掲載しません。図の箱に省略したリソースもここで検索できます。</p><input id="filter" type="search" placeholder="名前・種類・namespace・定義ファイルで検索"><p id="count"></p><table><thead><tr><th>種類</th><th>名前</th><th>定義</th><th>関連する図</th></tr></thead><tbody id="rows"></tbody></table>
<script type="module">
const records=await(await fetch('resource-inventory.json')).json(),coverage=await(await fetch('model-coverage.json')).json(),manifest=await(await fetch('view-manifest.json')).json(),byId=new Map(coverage.records.map(row=>[row.id,row])),rows=document.getElementById('rows');
function render(){const query=document.getElementById('filter').value.toLowerCase(),matches=records.filter(row=>JSON.stringify(row).toLowerCase().includes(query));document.getElementById('count').textContent=`${matches.length} / ${records.length} 件`;rows.replaceChildren();for(const item of matches){const tr=document.createElement('tr');for(const text of [item.type,item.name+(item.namespace?` (${item.namespace})`:'')]){const td=document.createElement('td');td.textContent=text;tr.append(td);}const td=document.createElement('td'),a=document.createElement('a');a.href='https://github.com/miutaku/my-infra/blob/main/'+item.file;a.textContent=item.file;td.append(a);tr.append(td);const context=byId.get(item.id),modelTd=document.createElement('td');if(context){const link=document.createElement('a');link.href=context.owner==='reventer'?'https://reventer-architecture.pages.dev/':'./#view='+encodeURIComponent(context.view);link.textContent=context.owner==='reventer'?'Re:Venter専用 / 利用側の構成図':manifest[context.view]?.title??'構成図';modelTd.append(link);}tr.append(modelTd);rows.append(tr);}}
document.getElementById('filter').oninput=render;render();
</script></html>
