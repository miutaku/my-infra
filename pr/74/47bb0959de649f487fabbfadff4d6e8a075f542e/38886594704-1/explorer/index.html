<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my-infra Architecture</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111318;color:#edf0f7;font:14px system-ui,sans-serif}header{min-height:72px;padding:14px 22px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-bottom:1px solid #333846}strong{font-size:18px}small{display:block;color:#9da8bc;margin-top:3px}nav{display:flex;gap:6px;flex:1}button,select{font:inherit;color:#e4e9f2;border:1px solid #434b5c;border-radius:7px;background:#202530;padding:8px 13px;cursor:pointer}button.active{background:#384b79;border-color:#7d9de2}label{display:flex;align-items:center;gap:10px}#note{padding:10px 22px;background:#1b2230;color:#cdd9f0;font-size:13px;border-bottom:1px solid #343d4e;line-height:1.6}iframe{display:block;width:100%;height:calc(100dvh - 173px);min-height:480px;border:0;background:#fff}@media(max-width:700px){header{gap:12px;padding:12px}nav{order:3;flex-basis:100%;overflow:auto}#note{padding:8px 12px}iframe{height:calc(100dvh - 230px)}}
dialog{width:min(1100px,95vw);max-height:85dvh;border:1px solid #4c5871;border-radius:12px;background:#171d29;color:#edf0f7;padding:24px}dialog::backdrop{background:#000a}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid #343d4e;overflow-wrap:anywhere}td a{color:#9ec2ff}#inventoryNote{color:#b3bed1;line-height:1.6}</style><header><div><strong>my-infra Architecture</strong><small>LikeC4 · 箱から詳細へ</small></div><nav aria-label="構成図"><button data-view="index">全体</button><button data-view="home_apps">自宅サービス</button><button data-view="placement">VM・LXC</button></nav><select id="perspective" aria-label="インフラの表示"><option value="" disabled>監視・秘密情報・配置</option><option value="secrets">秘密情報の管理・注入</option><option value="observability">監視の収集・保存・照会</option><option value="placement">配置・所有境界</option></select><button id="resources">リソース一覧</button><button id="up" hidden>← 全体へ戻る</button></header>
<fieldset id="lineFilters" style="display:flex;flex-wrap:wrap;gap:18px;margin:0;padding:10px 22px;border:0;border-bottom:1px solid #343d4e"><legend style="float:left;margin-right:18px;padding:0">表示する線</legend><label style="color:#82d994"><input type="checkbox" data-kind="runtime" checked>利用者・サービス通信</label><label style="color:#b8a5ff"><input type="checkbox" data-kind="admin" checked>管理アクセス</label><label style="color:#b8a5ff"><input type="checkbox" data-kind="deploy" checked>CI・デプロイ</label><label style="color:#ffaaa5"><input type="checkbox" data-kind="secret" checked>秘密情報の注入</label><label style="color:#f3cc72"><input type="checkbox" data-kind="observe" checked>監視の収集</label><label style="color:#79c8f7"><input type="checkbox" data-kind="query" checked>監視の照会</label><label style="color:#f3cc72"><input type="checkbox" data-kind="backup" checked>バックアップ</label><label style="color:#9da8bc"><input type="checkbox" data-kind="network" checked>ネットワーク接続</label><label style="color:#ffaaa5"><input type="checkbox" data-kind="power" checked>給電</label><label style="color:#79c8f7"><input type="checkbox" data-kind="connect" checked>外向き接続</label><label style="color:#9da8bc"><input type="checkbox" data-kind="provide" checked>基盤の提供</label><label style="color:#b8a5ff"><input type="checkbox" data-kind="authenticate" checked>認証後の転送</label><label style="color:#86aafc"><input type="checkbox" data-kind="member" checked>クラスタ所属</label><label style="color:#86aafc"><input type="checkbox" data-kind="host" checked>ホスト・実行基盤</label><button id="allLines" style="padding:3px 10px">すべて表示</button></fieldset><div id="note"></div><iframe id="diagram" title="LikeC4 インタラクティブ構成図"></iframe>
<dialog id="inventory"><div style="display:flex;justify-content:space-between;align-items:center;gap:20px"><strong id="inventoryTitle"></strong><button id="closeInventory">閉じる</button></div><p id="inventoryNote"></p><p><a href="./resources.html" style="color:#9ec2ff">名前・種類で検索し、関連する図を見る</a></p><table><thead><tr><th>種類</th><th>名前</th><th>定義</th></tr></thead><tbody id="inventoryRows"></tbody></table></dialog>
<script>
(async()=>{
const frame=document.querySelector('#diagram'),note=document.querySelector('#note');
const manifest=await fetch('./view-manifest.json').then(r=>r.json()),views=Object.keys(manifest);
const perspectives=document.querySelector('#perspective');perspectives.replaceChildren();const placeholder=document.createElement('option');placeholder.value='';placeholder.disabled=true;placeholder.textContent='その他の観点';perspectives.append(placeholder);for(const id of views.filter(id=>!['index','home_apps','placement','nextcloud','recording','recording_prd','recording_stg','loockit','vlans','platform'].includes(id))){const option=document.createElement('option');option.value=id;option.textContent=manifest[id].title;perspectives.append(option);}
const initial=new URLSearchParams(location.hash.slice(1));
let view=initial.get('view')||location.hash.match(/\/view\/([^/?]+)/)?.[1]||'index';if(!views.includes(view))view='index';
const defaults={runtime:true,admin:true,deploy:true,secret:true,observe:true,query:true,backup:true,network:true,power:true,connect:true,provide:true,authenticate:true,member:true,host:true};
window.myInfraLineFilters={...defaults};
try{const saved=JSON.parse(localStorage.getItem('my-infra-line-filters'));for(const kind of Object.keys(defaults))if(typeof saved?.[kind]==='boolean')window.myInfraLineFilters[kind]=saved[kind]}catch{}
const toggles=[...document.querySelectorAll('[data-kind]')];
function sendFilters(){for(const input of toggles)input.checked=window.myInfraLineFilters[input.dataset.kind];try{localStorage.setItem('my-infra-line-filters',JSON.stringify(window.myInfraLineFilters))}catch{}frame.contentWindow.postMessage({type:'my-infra:line-filters',filters:window.myInfraLineFilters},location.origin)}
for(const input of toggles)input.onchange=()=>{window.myInfraLineFilters={...window.myInfraLineFilters,[input.dataset.kind]:input.checked};sendFilters()};
document.querySelector('#allLines').onclick=()=>{window.myInfraLineFilters={...defaults};sendFilters()};frame.addEventListener('load',()=>{
 sendFilters();
 const document=frame.contentDocument;
 document.addEventListener('click',event=>{
  if(!(event.target instanceof frame.contentWindow.Element)||event.target.closest('button,a,input'))return;
  const node=event.target.closest('.react-flow__node[data-id]');
  const current=frame.contentWindow.location.hash.match(/\/view\/([^/?]+)/)?.[1];
  const target=manifest[current]?.deploymentNavigation?.[node?.dataset.id];
  if(!target)return;
  event.preventDefault();event.stopPropagation();frame.contentWindow.location.hash='/view/'+target;
 },true);
 for(const [id,target] of Object.entries(manifest[view]?.deploymentNavigation??{})){
  const node=document.querySelector(`.react-flow__node[data-id="${id}"]`);
  if(node)node.style.cursor='pointer';
 }
});
const pageKinds=Object.fromEntries(views.map(id=>[id,manifest[id].kinds]));
function update(){
 document.querySelector('#lineFilters').style.display=pageKinds[view].length?'flex':'none';
 for(const input of toggles)input.closest('label').style.display=pageKinds[view].includes(input.dataset.kind)?'flex':'none';
 const select=document.querySelector('#perspective');select.value=!['index','home_apps','placement'].includes(view)?view:'';
 document.querySelector('#up').hidden=view==='index';
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 note.textContent=manifest[view].description||manifest[view].title;history.replaceState(null,'',`#view=${view}`);
}
function show(){frame.src=`./diagram/#/view/${view}`;update()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;show()});document.querySelector('#perspective').onchange=e=>{view=e.target.value;show()};document.querySelector('#up').onclick=()=>{view='index';show()};
document.querySelector('#closeInventory').onclick=()=>document.querySelector('#inventory').close();
document.querySelector('#resources').onclick=async()=>{const rows=await fetch('./resource-inventory.json').then(r=>r.json());document.querySelector('#inventoryTitle').textContent=`リソース一覧 · ${rows.length} 定義`;document.querySelector('#inventoryNote').textContent='Terraform・Kubernetesから名前と定義元を自動抽出。名前・種類・ファイルは別ページでも検索できます。';const body=document.querySelector('#inventoryRows');body.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const key of ['type','name']){const td=document.createElement('td');td.textContent=r[key];tr.append(td)}const td=document.createElement('td'),a=document.createElement('a');a.href='https://github.com/miutaku/my-infra/blob/main/'+r.file;a.target='_blank';a.rel='noopener noreferrer';a.textContent=r.file;td.append(a);tr.append(td);body.append(tr)}document.querySelector('#inventory').showModal()};
setInterval(()=>{try{const next=frame.contentWindow.location.hash.match(/\/view\/([^/?]+)/)?.[1];if(views.includes(next)&&next!==view){view=next;update()}}catch{}},400);show();sendFilters();
})().catch(error=>{document.querySelector('#note').textContent='構成図を読み込めませんでした。ページを再読み込みしてください。';console.error(error)});
</script></html>
