apiVersion: v1
kind: Namespace
metadata:
  name: talos-poc-nfs-write
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: talos-poc-nfs-write
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=3
  nfs:
    server: 192.168.20.192
    path: /mnt/raid1_case/talos-poc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: disposable-nfs-write
  namespace: talos-poc-nfs-write
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: talos-poc-nfs-write
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-writer
  namespace: talos-poc-nfs-write
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  containers:
    - name: writer
      image: docker.io/library/busybox:1.37.0
      command: [sleep, infinity]
      volumeMounts:
        - name: test
          mountPath: /mnt/test
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
  volumes:
    - name: test
      persistentVolumeClaim:
        claimName: disposable-nfs-write
