apiVersion: v1
kind: Pod
metadata:
  name: mirakurun-copy-receiver
  namespace: app-mirakurun
spec:
  restartPolicy: Never
  containers:
    - name: receiver
      image: alpine:3.22
      command: [sh, -ec, sleep 86400]
      volumeMounts: [{name: data, mountPath: /target}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: mirakurun-data}
