apiVersion: v1
kind: Pod
metadata:
  name: victoria-metrics-copy-receiver
  namespace: monitoring
spec:
  restartPolicy: Never
  containers:
    - name: receiver
      image: alpine:3.22
      command: [sh, -ec, sleep 86400]
      volumeMounts:
        - {name: storage, mountPath: /target}
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: server-volume-victoria-metrics-green-0
