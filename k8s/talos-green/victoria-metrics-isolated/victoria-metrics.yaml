apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-green
spec:
  selector: {app: victoria-metrics-green}
  ports: [{name: http, port: 8428, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics-green
spec:
  serviceName: victoria-metrics-green
  replicas: 1
  selector:
    matchLabels: {app: victoria-metrics-green}
  template:
    metadata:
      labels: {app: victoria-metrics-green}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.113.0
          args:
            - --httpListenAddr=:8428
            - --loggerFormat=json
            - --retentionPeriod=30d
            - --storageDataPath=/storage
          ports: [{name: http, containerPort: 8428}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: server-volume, mountPath: /storage}
  volumeClaimTemplates:
    - metadata:
        name: server-volume
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 20Gi}
