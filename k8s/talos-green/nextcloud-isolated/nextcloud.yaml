apiVersion: v1
kind: Service
metadata:
  name: nextcloud
spec:
  selector: {app: nextcloud}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: nextcloud}
  template:
    metadata:
      labels: {app: nextcloud}
    spec:
      containers:
        - name: nextcloud
          image: ghcr.io/miutaku/nextcloud-ffmpeg:latest
          ports: [{name: http, containerPort: 80}]
          env:
            - {name: TZ, value: Asia/Tokyo}
            - {name: MYSQL_HOST, value: mariadb.infra-db.svc.cluster.local}
            - {name: MYSQL_DATABASE, value: nextcloud}
            - {name: MYSQL_USER, value: nextcloud}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-secrets, key: MYSQL_PASSWORD}}
            - {name: NEXTCLOUD_ADMIN_USER, value: admin}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: nextcloud-secrets, key: ADMIN_PASSWORD}}
            - {name: NEXTCLOUD_DATA_DIR, value: /var/www/html/data}
            - {name: NEXTCLOUD_TRUSTED_DOMAINS, value: nextcloud.miutaku.work}
            - {name: TRUSTED_PROXIES, value: 10.244.0.0/16}
            - {name: OVERWRITEPROTOCOL, value: https}
            - {name: OVERWRITECLIURL, value: "https://nextcloud.miutaku.work"}
            - {name: REDIS_HOST, value: nextcloud-redis}
            - {name: PHP_MEMORY_LIMIT, value: 512M}
            - {name: PHP_UPLOAD_LIMIT, value: 10G}
          volumeMounts:
            - {name: html, mountPath: /var/www/html}
            - {name: config-extra, mountPath: /var/www/html/config/previews.config.php, subPath: previews.config.php}
            - {name: config-extra, mountPath: /var/www/html/config/mimetypemapping.json, subPath: mimetypemapping.json}
            - {name: nas-recorded, mountPath: /mnt/nas/recorded, readOnly: true}
          startupProbe:
            httpGet: {path: /status.php, port: 80, httpHeaders: [{name: Host, value: nextcloud.miutaku.work}]}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /status.php, port: 80, httpHeaders: [{name: Host, value: nextcloud.miutaku.work}]}
            periodSeconds: 15
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: html
          persistentVolumeClaim: {claimName: nextcloud-html-pvc}
        - name: config-extra
          configMap: {name: nextcloud-config}
        - name: nas-recorded
          persistentVolumeClaim: {claimName: nextcloud-nas-recorded-pvc, readOnly: true}
