apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-prd-nginx-gateway-fabric
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/nginx/charts/nginx-gateway-fabric
    chart: nginx-gateway-fabric
    targetRevision: 2.6.7
    helm:
      releaseName: nginx-gateway-fabric
      skipCrds: true
      valuesObject:
        nginxGateway:
          replicas: 2
          nodeSelector:
            kubernetes.io/arch: arm64
          resources:
            requests:
              cpu: 100m
              memory: 90Mi
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-gateway-fabric
                    app.kubernetes.io/instance: nginx-gateway-fabric
        nginx:
          replicas: 2
          container:
            resources:
              requests:
                cpu: 100m
                memory: 90Mi
          pod:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                    - key: gateway.networking.k8s.io/gateway-name
                      operator: Exists
          patches:
          - type: StrategicMerge
            value:
              spec:
                strategy:
                  rollingUpdate:
                    maxSurge: 1
                    maxUnavailable: 0
          service:
            type: LoadBalancer
            patches:
            - type: StrategicMerge
              value:
                metadata:
                  annotations:
                    service.beta.kubernetes.io/oci-load-balancer-shape: flexible
                    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: '10'
                    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: '10'
          config:
            rewriteClientIP:
              mode: XForwardedFor
              setIPRecursively: true
              trustedAddresses:
              - type: CIDR
                value: 173.245.48.0/20
              - type: CIDR
                value: 103.21.244.0/22
              - type: CIDR
                value: 103.22.200.0/22
              - type: CIDR
                value: 103.31.4.0/22
              - type: CIDR
                value: 141.101.64.0/18
              - type: CIDR
                value: 108.162.192.0/18
              - type: CIDR
                value: 190.93.240.0/20
              - type: CIDR
                value: 188.114.96.0/20
              - type: CIDR
                value: 197.234.240.0/22
              - type: CIDR
                value: 198.41.128.0/17
              - type: CIDR
                value: 162.158.0.0/15
              - type: CIDR
                value: 104.16.0.0/13
              - type: CIDR
                value: 104.24.0.0/14
              - type: CIDR
                value: 172.64.0.0/13
              - type: CIDR
                value: 131.0.72.0/22
        extraObjects:
        - "apiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: nginx-gateway-fabric\n\
          \  namespace: nginx-gateway\nspec:\n  minAvailable: 1\n  selector:\n   \
          \ matchLabels:\n      app.kubernetes.io/name: nginx-gateway-fabric\n   \
          \   app.kubernetes.io/instance: nginx-gateway-fabric\n"
  destination:
    name: oke-prd
    namespace: nginx-gateway
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: nginx-gateway-fabric
    namespace: nginx-gateway
    jsonPointers:
    - /spec/strategy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - Replace=true
