apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ../../base
configMapGenerator:
  - name: grafana-alloy-routing
    literals:
      - ENVIRONMENT=stg
      - METRICS_CLUSTER=oke-stg
      - LOCAL_METRICS_01=http://reventermon1.reventermon.okevcn.oraclevcn.com:18428/api/v1/write
      - LOCAL_METRICS_02=http://reventermon2.reventermon.okevcn.oraclevcn.com:18428/api/v1/write
      - LOCAL_LOGS_01=http://reventermon1.reventermon.okevcn.oraclevcn.com:19428/insert/loki/api/v1/push
      - LOCAL_LOGS_02=http://reventermon2.reventermon.okevcn.oraclevcn.com:19428/insert/loki/api/v1/push
generatorOptions:
  disableNameSuffixHash: true
