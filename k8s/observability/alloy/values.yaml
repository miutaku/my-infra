image:
  tag: v1.7.0
  digest: sha256:afcc9d32975dd567b2e7c87f0c2f0e4ebf9385ecc36e1c0d44ba42de6dcf291c
rbac:
  create: false
alloy:
  configMap:
    create: false
    name: grafana-alloy
    key: config.alloy
  envFrom:
    - configMapRef:
        name: grafana-alloy-routing
  # Required key refs keep the Pod waiting for ESO rather than starting with
  # empty Logs credentials during an existing Secret's first reconciliation.
  extraEnv:
    - name: GRAFANA_CLOUD_METRICS_URL
      valueFrom:
        secretKeyRef: {name: grafana-cloud-credentials, key: GRAFANA_CLOUD_METRICS_URL}
    - name: GRAFANA_CLOUD_METRICS_USERNAME
      valueFrom:
        secretKeyRef: {name: grafana-cloud-credentials, key: GRAFANA_CLOUD_METRICS_USERNAME}
    - name: GRAFANA_CLOUD_METRICS_PASSWORD
      valueFrom:
        secretKeyRef: {name: grafana-cloud-credentials, key: GRAFANA_CLOUD_METRICS_PASSWORD}
    - name: GRAFANA_CLOUD_LOGS_URL
      valueFrom:
        secretKeyRef: {name: grafana-cloud-credentials, key: GRAFANA_CLOUD_LOGS_URL}
    - name: GRAFANA_CLOUD_LOGS_USERNAME
      valueFrom:
        secretKeyRef: {name: grafana-cloud-credentials, key: GRAFANA_CLOUD_LOGS_USERNAME}
    - name: GRAFANA_CLOUD_LOGS_PASSWORD
      valueFrom:
        secretKeyRef: {name: grafana-cloud-credentials, key: GRAFANA_CLOUD_LOGS_PASSWORD}
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
controller:
  type: daemonset
  nodeSelector:
    kubernetes.io/arch: arm64
  podAnnotations:
    prometheus.io/scrape: "false"
