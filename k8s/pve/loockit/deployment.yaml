apiVersion: apps/v1
kind: Deployment
metadata:
  name: loockit
  namespace: app-loockit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loockit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loockit
    spec:
      nodeSelector:
        hardware.miutaku/bluetooth: "true"
      tolerations:
        - key: node.miutaku/architecture
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: loockit
          image: ghcr.io/miutaku/loockit:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --config
            - /config/config.toml
          envFrom:
            - secretRef:
                name: loockit-keys
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
      volumes:
        - name: config
          configMap:
            name: loockit-config
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
