apiVersion: apps/v1
kind: Deployment
metadata:
  name: loockit
  namespace: app-loockit
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: loockit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loockit
      annotations:
        loockit.miutaku/config-revision: front-door-v2
    spec:
      serviceAccountName: loockit
      nodeSelector:
        hardware.miutaku/bluetooth: "true"
        loockit.miutaku/receiver: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: loockit
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.miutaku/architecture
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: loockit
          image: ghcr.io/miutaku/loockit:0.1.13
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --config
            - /config/config.toml
          envFrom:
            - secretRef:
                name: loockit-keys
          env:
            - name: LOOCKIT_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: rest
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os, urllib.request;
                  assert len(os.listdir('/proc/1/fd')) < 96,
                  'possible D-Bus FD leak';
                  urllib.request.urlopen('http://127.0.0.1:8080/healthz',
                  timeout=3).read()
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
      volumes:
        - name: config
          configMap:
            name: loockit-config
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
