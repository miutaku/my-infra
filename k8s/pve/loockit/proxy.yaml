apiVersion: v1
kind: ConfigMap
metadata:
  name: loockit-proxy
  namespace: app-loockit
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      nbthread 1
    defaults
      log global
      timeout connect 3s
      timeout client 65s
      timeout server 65s
    frontend rest
      bind :8080
      mode http
      default_backend rest
    backend rest
      mode http
      option httpchk GET /readyz
      http-check expect status 200
      server x570 192.168.20.133:8080 check inter 2s fall 2 rise 2
      server b550m 192.168.20.134:8080 check inter 2s fall 2 rise 2
    frontend grpc
      bind :50051
      mode tcp
      default_backend grpc
    backend grpc
      mode tcp
      option httpchk GET /readyz
      http-check expect status 200
      server x570 192.168.20.133:50051 check port 8080 inter 2s fall 2 rise 2
      server b550m 192.168.20.134:50051 check port 8080 inter 2s fall 2 rise 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loockit-proxy
  namespace: app-loockit
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loockit-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loockit-proxy
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: loockit-proxy
      containers:
        - name: haproxy
          image: haproxy:3.2.9-alpine
          args: ["-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - {name: rest, containerPort: 8080}
            - {name: grpc, containerPort: 50051}
          readinessProbe:
            tcpSocket: {port: rest}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 99
            runAsGroup: 99
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: loockit-proxy
