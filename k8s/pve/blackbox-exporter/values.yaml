automountServiceAccountToken: true

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
    http_2xx_insecure:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
        tls_config:
          insecure_skip_verify: true
    icmp:
      prober: icmp
      timeout: 5s
      icmp:
        preferred_ip_protocol: "ip4"
    nextcloud_status:
      prober: http
      timeout: 5s
      http:
        follow_redirects: false
        preferred_ip_protocol: ip4
        headers:
          Host: nextcloud.miutaku.work
        fail_if_body_not_matches_regexp:
          - '"installed"\s*:\s*true'
          - '"maintenance"\s*:\s*false'
          - '"needsDbUpgrade"\s*:\s*false'
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
    tls_certificate:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
        # Internal kubelet certificates use private cluster PKI. Expiration is
        # checked explicitly; public Access probes use normal CA verification.
        tls_config:
          insecure_skip_verify: true
    https_kubernetes_ready:
      prober: http
      timeout: 5s
      http:
        follow_redirects: false
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: kubernetes.default.svc
        fail_if_body_not_matches_regexp: ['^ok$']
    dns_internal:
      prober: dns
      timeout: 5s
      dns:
        preferred_ip_protocol: ip4
        query_name: pve-x570.miutaku.internal
        query_type: A
        valid_rcodes: [NOERROR]
        validate_answer_rrs:
          fail_if_not_matches_regexp: ['pve-x570\.miutaku\.internal\.\s+.*IN\s+A\s+192\.168\.0\.115']
    dns_external:
      prober: dns
      timeout: 5s
      dns:
        preferred_ip_protocol: ip4
        query_name: example.com
        query_type: A
        valid_rcodes: [NOERROR]
        validate_answer_rrs:
          fail_if_none_matches_regexp: ['.+\s+IN\s+A\s+.+']

# ServiceMonitor はこのリポジトリでは管理しない
serviceMonitor:
  enabled: false

service:
  port: 9115
  type: ClusterIP

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

tolerations:
  - key: workload.miutaku/arm64
    operator: Equal
    value: reviewed
    effect: NoSchedule

pod:
  labels:
    descheduler.miutaku/metrics-rebalance: "true"

# ターゲット一覧は利用中の scrape 設定側で管理する
