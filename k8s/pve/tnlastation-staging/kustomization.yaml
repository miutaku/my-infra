apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-tnlastation-staging
resources:
  - ../tnlastation
images:
  - name: ghcr.io/miutaku/tnlastation-backend
    newTag: staging
  - name: ghcr.io/miutaku/tnlastation-ffmpeg-worker
    newTag: staging
  - name: ghcr.io/miutaku/tnlastation-frontend
    newTag: staging
patches:
  # staging は staging tagを上書きし続けるので、既定の IfNotPresent だとnodeが古いimageを
  # 使い続け、buildし直しても入れ替わらない。ここだけ必ず取りに行かせる。
  # prdは版で固定したtagなので不要。
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/initContainers/1/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: ffmpeg-worker-encode
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: ffmpeg-worker-streaming
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Service
      name: tnlastation
    patch: |-
      - op: replace
        path: /metadata/annotations/metallb.universe.tf~1loadBalancerIPs
        value: "192.168.20.215"
  - path: backend-patch.yaml
  - path: secret-patch.yaml
  - target:
      kind: PersistentVolume
      name: tnlastation-recorded-pv
    patch: |-
      - op: replace
        path: /metadata/name
        value: tnlastation-staging-recorded-pv
      - op: replace
        path: /spec/nfs/path
        value: /mnt/raid1_case/recorded-staging
  - target:
      kind: PersistentVolumeClaim
      name: tnlastation-recorded
    patch: |-
      - op: replace
        path: /spec/volumeName
        value: tnlastation-staging-recorded-pv
  - target:
      kind: PersistentVolume
      name: tnlastation-app-data-pv
    patch: |-
      - op: replace
        path: /metadata/name
        value: tnlastation-staging-app-data-pv
      - op: replace
        path: /spec/nfs/path
        value: /mnt/raid1_case/tnlastation-staging
  - target:
      kind: PersistentVolumeClaim
      name: tnlastation-app-data
    patch: |-
      - op: replace
        path: /spec/volumeName
        value: tnlastation-staging-app-data-pv
