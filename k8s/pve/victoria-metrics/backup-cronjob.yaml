apiVersion: batch/v1
kind: CronJob
metadata:
  name: victoria-metrics-backup
spec:
  suspend: true
  # Incremental backup every hour. The latest backup always contains the full
  # retention window currently held by VictoriaMetrics.
  schedule: "20 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          # The workspace only holds one internally consistent backup while this
          # Job runs. IDrive is the durable copy, so this volume need not survive a
          # node failure or the next Job.
          initContainers:
            - name: snapshot-backup
              image: victoriametrics/vmbackup:v1.113.0
              args:
                - -storageDataPath=/storage
                - -snapshot.createURL=http://victoria-metrics:8428/snapshot/create
                - -dst=fs:///workspace/latest
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /storage
                  readOnly: true
                - name: workspace
                  mountPath: /workspace
          containers:
            # Keep vmbackup for snapshot consistency; upload its filesystem
            # output with rclone to the versioned IDrive e2 backup bucket.
            - name: upload
              image: rclone/rclone:1.75.1
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  destination=idrive:miutaku-my-infra-backup/victoria-metrics/latest
                  rclone sync /workspace/latest "$destination" --checksum --fast-list \
                    --s3-upload-cutoff=5Gi --transfers=2 --checkers=4 --stats=10s
                  # vmbackup control markers change even when their size is unchanged.
                  # Encrypted S3 objects may lack a usable ETag hash, so force these
                  # tiny files to be refreshed while keeping data parts incremental.
                  rclone copy /workspace/latest "$destination" --include '*.ignore' \
                    --ignore-times --s3-upload-cutoff=5Gi --transfers=2 --checkers=4
                  rclone check /workspace/latest "$destination" --download --one-way \
                    --checkers=4
              envFrom:
                - secretRef:
                    name: victoria-metrics-backup-credentials
              env:
                - name: RCLONE_CONFIG_IDRIVE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_IDRIVE_PROVIDER
                  value: IDrive
                - name: RCLONE_CONFIG_IDRIVE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: victoria-metrics-backup-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_IDRIVE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: victoria-metrics-backup-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_IDRIVE_ENDPOINT
                  value: https://s3.ap-northeast-1.idrivee2.com
                - name: RCLONE_CONFIG_IDRIVE_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_IDRIVE_SERVER_SIDE_ENCRYPTION
                  value: aws:kms
                - name: RCLONE_CONFIG_IDRIVE_REGION
                  value: ap-northeast-1
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: victoria-metrics-data-nfs
                readOnly: true
            - name: workspace
              emptyDir:
                sizeLimit: 10Gi
