apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: infra-db
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    umask 077

    apk add --no-cache mariadb-client rclone curl > /dev/null

    STATUS=failure
    CURRENT=""
    RESULTS=""

    notify() {
      [ -z "${NOTIFY_WEBHOOK}" ] && return 0
      if [ "${STATUS}" = "success" ]; then
        CONTENT="DBバックアップ完了: ${RESULTS}"
        WEBHOOK="${NOTIFY_WEBHOOK}"
      else
        CONTENT="@here DBバックアップ失敗 (${CURRENT:-error before dump}): ${RESULTS:-none}"
        WEBHOOK="${CRITICAL_WEBHOOK}"
      fi
      curl -s -X POST "${WEBHOOK}" \
        -H 'Content-Type: application/json' \
        -d "{\"content\":\"${CONTENT}\"}"
    }
    trap notify EXIT

    mkdir -p /root/.config/rclone
    cat > /root/.config/rclone/rclone.conf << EOF
    [idrive]
    type = s3
    provider = IDrive
    access_key_id = ${IDRIVE_ACCESS_KEY_ID}
    secret_access_key = ${IDRIVE_SECRET_ACCESS_KEY}
    endpoint = https://s3.ap-northeast-1.idrivee2.com
    region = ap-northeast-1
    no_check_bucket = true
    server_side_encryption = aws:kms
    EOF

    DATE=$(date +%Y%m%d-%H%M%S)

    bucket="${IDRIVE_BACKUP_BUCKET:-miutaku-my-infra-db-backup}"

    upload_verified() {
      source="$1"
      destination="idrive:${bucket}/$2"
      rclone copyto "${source}" "${destination}"
      expected=$(sha256sum "${source}" | cut -d ' ' -f1)
      actual=$(rclone cat "${destination}" | sha256sum | cut -d ' ' -f1)
      [ "${expected}" = "${actual}" ] || { echo "downloaded backup checksum differs" >&2; return 1; }
    }

    # MariaDBはsystem database、accounts、grantsも含めてserver全体を取得する。
    CURRENT=mariadb-full
    mariadb_file="mariadb-full-${DATE}.sql.gz"
    mariadb-dump \
      -h mariadb.infra-db.svc.cluster.local \
      -u root -p"${MYSQL_ROOT_PASSWORD}" \
      --all-databases \
      --single-transaction \
      --routines \
      --events \
      --triggers \
      --hex-blob \
      > /tmp/mariadb-full.sql
    gzip -c /tmp/mariadb-full.sql > /tmp/mariadb-full.sql.gz
    rm /tmp/mariadb-full.sql
    gzip -t /tmp/mariadb-full.sql.gz
    upload_verified /tmp/mariadb-full.sql.gz "mariadb/${mariadb_file}"
    echo "[mariadb-full] uploaded: mariadb/${mariadb_file} ($(du -sh /tmp/mariadb-full.sql.gz | cut -f1))"
    RESULTS="${RESULTS}mariadb/${mariadb_file} "

    backup_postgres_cluster() {
      cluster="$1"
      host="$2"
      list="/tmp/${cluster}-databases"

      CURRENT="${cluster}-globals"
      globals_file="${cluster}-globals-${DATE}.sql.gz"
      PGPASSWORD="${POSTGRES_PASSWORD}" pg_dumpall \
        --host="${host}" \
        --username=tnlastation \
        --globals-only \
        > "/tmp/${cluster}-globals.sql"
      gzip -c "/tmp/${cluster}-globals.sql" > "/tmp/${cluster}-globals.sql.gz"
      rm "/tmp/${cluster}-globals.sql"
      gzip -t "/tmp/${cluster}-globals.sql.gz"
      upload_verified "/tmp/${cluster}-globals.sql.gz" "${cluster}/${globals_file}"
      RESULTS="${RESULTS}${cluster}/${globals_file} "

      # 新規DBも自動的に対象になるよう、template以外を毎回serverから列挙する。
      PGPASSWORD="${POSTGRES_PASSWORD}" psql \
        --host="${host}" \
        --username=tnlastation \
        --dbname=postgres \
        --no-align --tuples-only \
        --command="SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname" \
        > "${list}"

      while IFS= read -r database; do
        [ -n "${database}" ] || continue
        safe_database="$(printf '%s' "${database}" | tr -c 'A-Za-z0-9._-' '_')"
        CURRENT="${cluster}/${database}"
        dump_file="${safe_database}-${DATE}.dump"
        PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
          --host="${host}" \
          --username=tnlastation \
          --dbname="${database}" \
          --format=custom \
          --file="/tmp/${cluster}-${safe_database}.dump"
        pg_restore --list "/tmp/${cluster}-${safe_database}.dump" >/dev/null
        upload_verified "/tmp/${cluster}-${safe_database}.dump" "${cluster}/${dump_file}"
        echo "[${cluster}/${database}] uploaded: ${cluster}/${dump_file}"
        RESULTS="${RESULTS}${cluster}/${dump_file} "
      done < "${list}"
    }

    backup_postgres_cluster postgres-prod postgres.infra-db.svc.cluster.local
    backup_postgres_cluster postgres-staging postgres.infra-db-staging.svc.cluster.local

    STATUS=success
