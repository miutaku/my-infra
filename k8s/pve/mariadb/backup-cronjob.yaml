apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: infra-db
spec:
  suspend: true
  schedule: "0 18 * * *"  # 03:00 JST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure

          containers:
            - name: backup
              # pg_dump must not be older than the PostgreSQL 18 server.
              image: postgres:18-alpine
              command: ["sh", "/scripts/backup.sh"]
              env:
                - name: IDRIVE_BACKUP_BUCKET
                  # Unique logical dumps go to the 30-day retention bucket.
                  # Its writer credential cannot delete objects or versions.
                  value: miutaku-my-infra-db-backup
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-credentials
                      key: MYSQL_ROOT_PASSWORD
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-credentials
                      key: POSTGRES_PASSWORD
                - name: IDRIVE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-credentials
                      key: IDRIVE_ACCESS_KEY_ID
                - name: IDRIVE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-credentials
                      key: IDRIVE_SECRET_ACCESS_KEY
                - name: NOTIFY_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-credentials
                      key: NOTIFY_WEBHOOK
                - name: CRITICAL_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-credentials
                      key: CRITICAL_WEBHOOK
              volumeMounts:
                - name: scripts
                  mountPath: /scripts

          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0755
