apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-backup-credentials
  namespace: infra-db
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: db-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        # BSM シークレット名: SHARED_MARIADB_ROOT_PASSWORD
        key: SHARED_MARIADB_ROOT_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: TNLASTATION_POSTGRES_PASSWORD
    - secretKey: IDRIVE_ACCESS_KEY_ID
      remoteRef:
        key: MY_INFRA_IDRIVE_S3_ACCESS_KEY
    - secretKey: IDRIVE_SECRET_ACCESS_KEY
      remoteRef:
        key: MY_INFRA_IDRIVE_S3_SECRET_KEY
    - secretKey: NOTIFY_WEBHOOK
      remoteRef:
        # BSM シークレット名: DB_BACKUP_NOTIFY_WEBHOOK (DBバックアップ全体で共用)
        key: MARIADB_BACKUP_NOTIFY_WEBHOOK
    - secretKey: CRITICAL_WEBHOOK
      remoteRef:
        # BSM シークレット名: DB_BACKUP_CRITICAL_WEBHOOK (DBバックアップ全体で共用)
        key: MARIADB_BACKUP_CRITICAL_WEBHOOK
