---
kind: Namespace
apiVersion: v1
metadata:
  annotations:
    # Application の cascade delete から除外する。namespace が消えると
    # 中の PVC ごと失われるため。
    argocd.argoproj.io/sync-options: Delete=false
  name: app-gptwol
  labels:
    name: gptwol
    app: gptwol
    # WoL requires hostNetwork and NET_RAW; scope the exception to this app.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
