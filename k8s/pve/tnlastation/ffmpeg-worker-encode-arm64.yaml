apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg-worker-encode-arm64
  namespace: app-tnlastation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tnlastation-ffmpeg-worker-encode-arm64
  template:
    metadata:
      labels:
        app: tnlastation-ffmpeg-worker-encode-arm64
        workload.miutaku/tnlastation-role: batch-encode
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        workload.miutaku/tnlastation-batch-encode: "true"
      tolerations:
        - key: node.miutaku/architecture
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: ffmpeg-worker
          image: ghcr.io/miutaku/tnlastation-ffmpeg-worker:1.1.3
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: EPGSTATION_CONFIG
              value: /epgstation-config/config.yml
            - name: EPGSTATION_LOG_DIR
              value: /var/lib/tnlastation/logs
            - name: ConnectionStrings__PostgreSQL
              valueFrom:
                secretKeyRef:
                  name: tnlastation-secrets
                  key: POSTGRES_CONNECTION_STRING
            - name: Encode__ConcurrentEncodeNum
              value: "1"
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 768Mi
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - curl -sf --max-time 7100 -X POST http://localhost:8080/internal/drain || true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /epgstation-config
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: app-data
              mountPath: /var/lib/tnlastation
            - name: recorded
              mountPath: /recorded
      terminationGracePeriodSeconds: 7200
      volumes:
        - name: config
          configMap:
            name: tnlastation-config
        - name: app-data
          persistentVolumeClaim:
            claimName: tnlastation-app-data
        - name: recorded
          persistentVolumeClaim:
            claimName: tnlastation-recorded
