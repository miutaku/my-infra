          mp4:
            - name: 1080p
              cmd: >-
                %FFMPEG% -dual_mono_mode main -ss %SS% -i %INPUT% -sn -threads 0
                -c:a aac -ar 48000 -b:a 192k -ac 2
                -c:v libx264 -vf scale=-2:1080 -b:v 5000k -profile:v baseline -preset veryfast
