apiVersion: v1
kind: PersistentVolume
metadata:
  name: tnlastation-recorded-pv
spec:
  capacity:
    storage: 8Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.20.192
    path: /mnt/raid1_case/recorded
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=3
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tnlastation-recorded
  namespace: app-tnlastation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
  volumeName: tnlastation-recorded-pv
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tnlastation-app-data-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.20.192
    # backendとFFmpeg WorkerがHLS、thumbnail、drop logを共有する。
    # TrueNAS側で事前にこのdirectoryを作成すること。
    path: /mnt/raid1_case/tnlastation
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=3
    # 既定 (acdirmin=30) だと worker が書いた HLS playlist が backend から 20 秒以上見えない。
    - actimeo=1
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tnlastation-app-data
  namespace: app-tnlastation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: tnlastation-app-data-pv
  storageClassName: ""

