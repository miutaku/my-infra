apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app-tnlastation
spec:
  type: ClusterIP
  selector:
    app: tnlastation-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app-tnlastation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tnlastation-backend
  template:
    metadata:
      labels:
        app: tnlastation-backend
      annotations:
        tnlastation.miutaku.work/config-revision: live-without-re-v2
    spec:
      initContainers:
        - name: fix-recorded-permissions
          image: busybox:1.37
          command:
            - sh
            - -c
            - chown 1654:1654 /recorded && chmod 0775 /recorded
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: recorded
              mountPath: /recorded
        - name: wait-for-postgres
          image: postgres:18-bookworm
          command:
            - sh
            - -ec
            - until pg_isready -h postgres.infra-db.svc.cluster.local -U tnlastation -d tnlastation; do sleep 2; done
        - name: migrate
          image: ghcr.io/miutaku/tnlastation-backend:1.1.1
          command:
            - dotnet
            - /app/migrator/TNLAStation.Migrator.dll
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__PostgreSQL
              valueFrom:
                secretKeyRef:
                  name: tnlastation-secrets
                  key: POSTGRES_CONNECTION_STRING
            - name: TZ
              value: Asia/Tokyo
      containers:
        - name: backend
          image: ghcr.io/miutaku/tnlastation-backend:1.1.1
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: Server__Port
              value: "8080"
            - name: Server__ClientSocketioPort
              value: "443"
            - name: EPGSTATION_CONFIG
              value: /epgstation-config/config.yml
            - name: EPGSTATION_LOG_DIR
              value: /var/lib/tnlastation/logs
            - name: FfmpegWorker__BaseUrl
              # 旧構成との互換用。1.1.0以降は下の用途別URLを優先する。
              value: http://ffmpeg-worker-streaming.app-tnlastation.svc.cluster.local:8080
            - name: FfmpegWorker__EncodeBaseUrl
              # probeとthumbnail用。録画TSのjob本体はWorkerがPostgreSQLからpullする。
              value: http://ffmpeg-worker-encode.app-tnlastation.svc.cluster.local:8080
            # 低遅延ライブ (LL-HLS)。空なら選択肢に出さない。
            - name: Streaming__LowLatencyHls__PlaylistUrlTemplate
              value: /lowlatency/live/{streamId}/index.m3u8
            # LL-HLS の画質。添字がそのまま mode になるので、並びを変えると既存の URL の意味が変わる。
            # 1 つでも指定すると既定値は使われなくなるため、使う画質はすべて書く。
            # 1080p は 720p のおよそ 2 倍の CPU を食う。同時視聴数はそのぶん減る。
            - name: Streaming__LiveModes__0__Name
              value: 720p
            - name: Streaming__LiveModes__0__Height
              value: "720"
            - name: Streaming__LiveModes__0__VideoBitrate
              value: 3000k
            - name: Streaming__LiveModes__0__AudioBitrate
              value: 192k
            - name: Streaming__LiveModes__1__Name
              value: 480p
            - name: Streaming__LiveModes__1__Height
              value: "480"
            - name: Streaming__LiveModes__1__VideoBitrate
              value: 1500k
            - name: Streaming__LiveModes__1__AudioBitrate
              value: 128k
            - name: Streaming__LiveModes__2__Name
              value: 360p
            - name: Streaming__LiveModes__2__Height
              value: "360"
            - name: Streaming__LiveModes__2__VideoBitrate
              value: 700k
            - name: Streaming__LiveModes__2__AudioBitrate
              value: 96k
            - name: Streaming__LiveModes__3__Name
              value: 1080p
            - name: Streaming__LiveModes__3__Height
              value: "1080"
            - name: Streaming__LiveModes__3__VideoBitrate
              value: 6000k
            - name: Streaming__LiveModes__3__AudioBitrate
              value: 192k
            - name: FfmpegWorker__StreamingBaseUrl
              value: http://ffmpeg-worker-streaming.app-tnlastation.svc.cluster.local:8080
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FfmpegWorker__StreamingBaseUrls__0
              value: http://ffmpeg-worker-streaming-0.ffmpeg-worker-streaming-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: FfmpegWorker__StreamingBaseUrls__1
              value: http://ffmpeg-worker-streaming-1.ffmpeg-worker-streaming-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: FfmpegWorker__StreamingBaseUrls__2
              value: http://ffmpeg-worker-streaming-2.ffmpeg-worker-streaming-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: FfmpegWorker__StreamingNodeWeights__worker-01-rke2-agent-ubuntu-26-04-home-amd64
              value: "16"
            - name: FfmpegWorker__StreamingNodeWeights__worker-02-rke2-agent-ubuntu-26-04-home-amd64
              value: "6"
            - name: ConnectionStrings__PostgreSQL
              valueFrom:
                secretKeyRef:
                  name: tnlastation-secrets
                  key: POSTGRES_CONNECTION_STRING
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - curl -sf --max-time 7100 -X POST http://localhost:8080/internal/drain || true
          readinessProbe:
            httpGet:
              path: /internal/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /epgstation-config
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: app-data
              mountPath: /var/lib/tnlastation
            - name: recorded
              mountPath: /recorded
      terminationGracePeriodSeconds: 7200
      volumes:
        - name: config
          configMap:
            name: tnlastation-config
        - name: app-data
          persistentVolumeClaim:
            claimName: tnlastation-app-data
        - name: recorded
          persistentVolumeClaim:
            claimName: tnlastation-recorded
