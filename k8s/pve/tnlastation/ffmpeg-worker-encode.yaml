apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-worker-encode
  namespace: app-tnlastation
spec:
  selector:
    app: tnlastation-ffmpeg-worker-encode
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg-worker-encode
  namespace: app-tnlastation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tnlastation-ffmpeg-worker-encode
  template:
    metadata:
      labels:
        app: tnlastation-ffmpeg-worker-encode
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: tnlastation-ffmpeg-worker-streaming
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tnlastation-ffmpeg-worker-encode
      containers:
        - name: ffmpeg-worker
          image: ghcr.io/miutaku/tnlastation-ffmpeg-worker:1.1.0
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: EPGSTATION_CONFIG
              value: /epgstation-config/config.yml
            - name: EPGSTATION_LOG_DIR
              value: /var/lib/tnlastation/logs
            - name: ConnectionStrings__PostgreSQL
              valueFrom:
                secretKeyRef:
                  name: tnlastation-secrets
                  key: POSTGRES_CONNECTION_STRING
            - name: Encode__ConcurrentEncodeNum
              # 1 Pod 1 job。Pod数はHPAが増減する。
              value: "1"
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "8"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /epgstation-config
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: app-data
              mountPath: /var/lib/tnlastation
            - name: recorded
              mountPath: /recorded
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: tnlastation-config
        - name: app-data
          persistentVolumeClaim:
            claimName: tnlastation-app-data
        - name: recorded
          persistentVolumeClaim:
            claimName: tnlastation-recorded
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ffmpeg-worker-encode
  namespace: app-tnlastation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ffmpeg-worker-encode
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
