apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-worker-streaming
  namespace: app-tnlastation
spec:
  selector:
    app: tnlastation-ffmpeg-worker-streaming
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-worker-streaming-headless
  namespace: app-tnlastation
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: tnlastation-ffmpeg-worker-streaming
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ffmpeg-worker-streaming
  namespace: app-tnlastation
spec:
  serviceName: ffmpeg-worker-streaming-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tnlastation-ffmpeg-worker-streaming
  template:
    metadata:
      labels:
        app: tnlastation-ffmpeg-worker-streaming
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: tnlastation-ffmpeg-worker-encode
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tnlastation-ffmpeg-worker-streaming
      containers:
        - name: ffmpeg-worker
          image: ghcr.io/miutaku/tnlastation-ffmpeg-worker:1.1.0
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: EPGSTATION_CONFIG
              value: /epgstation-config/config.yml
            - name: EPGSTATION_LOG_DIR
              value: /var/lib/tnlastation/logs
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Ffmpeg__PublicBaseUrl
              value: http://$(POD_NAME).ffmpeg-worker-streaming-headless.app-tnlastation.svc.cluster.local:8080
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /epgstation-config
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: app-data
              mountPath: /var/lib/tnlastation
            - name: recorded
              mountPath: /recorded
      terminationGracePeriodSeconds: 120
      volumes:
        - name: config
          configMap:
            name: tnlastation-config
        - name: app-data
          persistentVolumeClaim:
            claimName: tnlastation-app-data
        - name: recorded
          persistentVolumeClaim:
            claimName: tnlastation-recorded
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ffmpeg-worker-streaming
  namespace: app-tnlastation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ffmpeg-worker-streaming
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 3600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
