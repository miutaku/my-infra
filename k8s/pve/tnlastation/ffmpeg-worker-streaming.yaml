apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-worker-streaming
  namespace: app-tnlastation
spec:
  selector:
    app: tnlastation-ffmpeg-worker-streaming
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-worker-streaming-headless
  namespace: app-tnlastation
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: tnlastation-ffmpeg-worker-streaming
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ffmpeg-worker-streaming
  namespace: app-tnlastation
spec:
  serviceName: ffmpeg-worker-streaming-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tnlastation-ffmpeg-worker-streaming
  template:
    metadata:
      labels:
        app: tnlastation-ffmpeg-worker-streaming
      annotations:
        tnlastation.miutaku.work/config-revision: live-without-re-v2
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 60
              preference:
                matchExpressions:
                  - key: topology.miutaku/proxmox-node
                    operator: In
                    values:
                      - pve-b550m
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: tnlastation-ffmpeg-worker-encode
      # ノード 2 台に HPA 3 replica。DoNotSchedule だと 3 本目が置けず更新が止まる。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tnlastation-ffmpeg-worker-streaming
      containers:
        - name: ffmpeg-worker
          image: ghcr.io/miutaku/tnlastation-ffmpeg-worker:1.1.0
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: EPGSTATION_CONFIG
              value: /epgstation-config/config.yml
            - name: EPGSTATION_LOG_DIR
              value: /var/lib/tnlastation/logs
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # backend の配信重み付けに使う。欠けると全ノードが重み 1 になる。
            - name: Worker__NodeName
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # 低遅延ライブのとき、受信した TS をここへ publish する。
            - name: Ffmpeg__LowLatencyPublishUrlTemplate
              value: rtsp://mediamtx:8554/live/{streamId}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # $(...) は先に定義した env しか展開しない。POD_NAME より後に置くこと。
            - name: Ffmpeg__PublicBaseUrl
              value: http://$(POD_NAME).ffmpeg-worker-streaming-headless.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: http
              containerPort: 8080
          # limits.cpu が同時視聴の上限を決める。worker は割り当て CPU から自分の定員を
          # 算出して backend へ報告し、backend は全 pod の合計を上限に使う。
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - curl -sf --max-time 7100 -X POST http://localhost:8080/internal/drain || true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /epgstation-config
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: app-data
              mountPath: /var/lib/tnlastation
            - name: recorded
              mountPath: /recorded
      terminationGracePeriodSeconds: 7200
      volumes:
        - name: config
          configMap:
            name: tnlastation-config
        - name: app-data
          persistentVolumeClaim:
            claimName: tnlastation-app-data
        - name: recorded
          persistentVolumeClaim:
            claimName: tnlastation-recorded
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ffmpeg-worker-streaming
  namespace: app-tnlastation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ffmpeg-worker-streaming
  minReplicas: 2
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 3600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
