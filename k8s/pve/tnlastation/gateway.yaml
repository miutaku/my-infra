apiVersion: v1
kind: Service
metadata:
  name: tnlastation
  namespace: app-tnlastation
  annotations:
    # LAN へ公開する。staging は overlay で別の IP に差し替える。
    metallb.universe.tf/loadBalancerIPs: "192.168.20.210"
spec:
  type: LoadBalancer
  selector:
    app: tnlastation-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: app-tnlastation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tnlastation-gateway
  template:
    metadata:
      labels:
        app: tnlastation-gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tnlastation-config

