apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: app-tnlastation
data:
  # compose 版 (TNLAStation/deploy/mediamtx.yml) と同じ内容にしておく。
  mediamtx.yml: |
    logLevel: info
    api: no
    metrics: no
    pprof: no
    playback: no
    rtmp: no
    srt: no
    webrtc: no

    rtsp: yes
    rtspAddress: :8554

    hls: yes
    hlsAddress: :8888
    hlsVariant: lowLatency
    hlsPartDuration: 500ms
    hlsSegmentDuration: 1s
    hlsSegmentCount: 7
    hlsAllowOrigin: '*'
    hlsAlwaysRemux: no

    paths:
      '~^live/.+$':
        source: publisher
---
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  namespace: app-tnlastation
spec:
  selector:
    app: tnlastation-mediamtx
  ports:
    # gateway が中継する LL-HLS。
    - name: hls
      port: 8888
      targetPort: hls
    # ffmpeg-worker からの publish。
    - name: rtsp
      port: 8554
      targetPort: rtsp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  namespace: app-tnlastation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tnlastation-mediamtx
  template:
    metadata:
      labels:
        app: tnlastation-mediamtx
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.9.3
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: hls
              containerPort: 8888
            - name: rtsp
              containerPort: 8554
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: hls
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
