apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reventer-admin-prd
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.discord: ''
spec:
  project: reventer-apps-prd
  source:
    repoURL: git@github.com:miutaku/reventer-infrastructure.git
    targetRevision: main
    path: infrastructure/k8s/admin-prd
    kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: admin-tunnel
          namespace: app-reventer-prd
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: admin-tunnel\n\
          \  namespace: app-reventer-prd\nspec:\n  strategy:\n    type: RollingUpdate\n\
          \    rollingUpdate:\n      maxSurge: 1\n      maxUnavailable: 0\n  template:\n\
          \    spec:\n      nodeSelector:\n        reventer.io/capacity: base\n  \
          \      node.info/compartment.id: aaaaaaaagv44lra2xieodrt75xzwqyvfrk35lpuon5fyxk4zzr52tqli3j5a\n\
          \      containers:\n      - name: cloudflared\n        image: docker.io/cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07\n\
          \        readinessProbe:\n          httpGet:\n            path: /ready\n\
          \            port: 2000\n          initialDelaySeconds: 10\n          periodSeconds:\
          \ 5\n          timeoutSeconds: 2\n          failureThreshold: 6"
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: admin
          namespace: app-reventer-prd
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: admin\n\
          \  namespace: app-reventer-prd\nspec:\n  template:\n    spec:\n      nodeSelector:\n\
          \        reventer.io/capacity: base\n        node.info/compartment.id: aaaaaaaagv44lra2xieodrt75xzwqyvfrk35lpuon5fyxk4zzr52tqli3j5a"
  destination:
    namespace: app-reventer-prd
    name: oke-prd
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: admin
    jsonPointers:
    - /spec/replicas
