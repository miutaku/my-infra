replicaCount: 1

remoteWrite:
  - url: http://victoria-metrics-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write

service:
  enabled: true
  servicePort: 8429
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  global:
    scrape_interval: 60s
    scrape_timeout: 30s

  scrape_configs:
    - job_name: home-service-monitor
      scrape_interval: 30s
      static_configs:
        - targets: [home-service-monitor.monitoring.svc.cluster.local:9810]

    - job_name: home-vip-monitor
      scrape_interval: 15s
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app]
          regex: monitoring;home-vip-monitor
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          regex: metrics
          action: keep
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance

    - job_name: etcd
      static_configs:
        - targets: ['192.168.20.137:2381']
          labels: {instance: controlplane-01-talos}
        - targets: ['192.168.20.138:2381']
          labels: {instance: controlplane-02-talos}
        - targets: ['192.168.20.139:2381']
          labels: {instance: controlplane-03-talos}

    - job_name: argocd-home
      static_configs:
        - targets: [argocd-metrics.argocd.svc.cluster.local:8082]
      metric_relabel_configs:
        - source_labels: [dest_namespace, name]
          regex: '((app-(annict.*|coredns|coupon-manager|epgstation|gptwol|loockit|magic-mirror|mirakurun(-staging)?|nextcloud|tnlastation(-staging)?)|infra-(backup|db(-staging)?)|monitoring|cloudflared|external-secrets|kube-system|kubelet-serving-cert-approver|metallb-system|arc-systems|tfc-agent);.*|argocd;(root-app|argocd|argocd-image-updater))'
          action: keep

    - job_name: arc-home
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_actions_github_com_scale_set_name]
          regex: 'arc-systems;(talos-infra-admin|architecture-automation-reader|architecture-automation-codex)'
          action: keep
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          regex: runner-scale-set-listener
          action: keep
        - source_labels: [__meta_kubernetes_pod_ip]
          target_label: __address__
          replacement: '$1:8080'
        - source_labels: [__meta_kubernetes_pod_label_actions_github_com_scale_set_name]
          target_label: scale_set

    - job_name: vmagent
      static_configs:
        - targets:
            - localhost:8429

    - job_name: kube-state-metrics
      static_configs:
        - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]
      metric_relabel_configs:
        # Collect node/global metrics and the home services managed here.
        - source_labels: [namespace]
          regex: "(|app-(annict.*|coredns|coupon-manager|epgstation|gptwol|loockit|magic-mirror|mirakurun(-staging)?|nextcloud|tnlastation(-staging)?)|infra-(backup|db(-staging)?)|monitoring|argocd|cloudflared|external-secrets|kube-system|kubelet-serving-cert-approver|metallb-system|arc-systems|tfc-agent)"
          action: keep

    - job_name: victoria-metrics
      static_configs:
        - targets: ["victoria-metrics.monitoring.svc.cluster.local:8428"]

    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          target_label: __address__
          regex: (.+);(.+)
          replacement: $1:$2
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node

    # node_exporter は host 側の systemd service なので、Kubernetes からは
    # 「:9100 が起動しているか」を事前判定できない。ここは非 k8s VM と
    # 物理ホスト(Raspberry Pi / Proxmox VE)を明示する。
    # home-k8sノード自体は下のnode_kubernetesジョブが自動検出する。
    - job_name: node_vm
      static_configs:
        - targets: ["dev-app-server.miutaku.internal:9100"]
          labels:
            instance: dev-app-server
        - targets: ["lb-01.miutaku.internal:9100"]
          labels:
            instance: lb-01
        - targets: ["lb-02.miutaku.internal:9100"]
          labels:
            instance: lb-02
        - targets: ["unifi.miutaku.internal:9100"]
          labels:
            instance: unifi-os-server
        - targets: ["rpib-plus-512m-01.miutaku.internal:9100"]
          labels:
            instance: nut-pi-01
            machine_type: raspberry-pi
        - targets: ["rpib-plus-512m-02.miutaku.internal:9100"]
          labels:
            instance: nut-pi-02
            machine_type: raspberry-pi
        - targets: ["pve-x570.miutaku.internal:9100"]
          labels:
            instance: pve-x570
            machine_type: proxmox-ve
        - targets: ["pve-b550m.miutaku.internal:9100"]
          labels:
            instance: pve-b550m
            machine_type: proxmox-ve
        - targets: ["pbs-01.miutaku.internal:9100"]
          labels:
            instance: pbs-01
        - targets: ["smart-display.miutaku.internal:9100"]
          labels:
            instance: smart-display

    # home-k8sノードのnode_exporterはprometheus-node-exporter DaemonSet
    # (monitoring ns, hostNetwork:9101) を Kubernetes Pod discovery で自動検出する。
    - job_name: node_kubernetes
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [monitoring]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: prometheus-node-exporter
        # Always prefer the Kubernetes node name to the discovered Pod IP.
        # Shorten the current home-k8s node names for dashboards.
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
          regex: (.+-talos)-home-pve-amd64
          replacement: $1
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
          regex: worker-01-talos-home-pve-amd64
          replacement: worker-01-talos

    - job_name: snmp
      metrics_path: /snmp
      params:
        module: [ix2215]
        auth: [ix2215_v2]
      static_configs:
        - targets: ["192.168.0.254"]
          labels:
            instance: ix2215
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: snmp-exporter-prometheus-snmp-exporter.monitoring.svc.cluster.local:9116

    - job_name: snmp_truenas
      metrics_path: /snmp
      params:
        module: [truenas]
        auth: [truenas_v2]
      static_configs:
        - targets: ["192.168.20.191"]
          labels:
            instance: nas-01
        - targets: ["192.168.20.192"]
          labels:
            instance: nas-02
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: snmp-exporter-prometheus-snmp-exporter.monitoring.svc.cluster.local:9116

    - job_name: pve
      metrics_path: /pve
      static_configs:
        - targets: ["192.168.0.115"]
          labels:
            instance: pve-x570
        - targets: ["192.168.0.119"]
          labels:
            instance: pve-b550m
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: pve-exporter.monitoring.svc.cluster.local:9221

    - job_name: nut
      metrics_path: /ups_metrics
      scrape_interval: 15s
      scrape_timeout: 10s
      static_configs:
        - targets: ["nut-exporter.monitoring.svc.cluster.local:9199"]
          labels:
            instance: ups-a
            server: 192.168.10.112
            ups: ups-a
        - targets: ["nut-exporter.monitoring.svc.cluster.local:9199"]
          labels:
            instance: ups-b
            server: 192.168.10.113
            ups: ups-b
      relabel_configs:
        - source_labels: [server]
          target_label: __param_server
        - source_labels: [ups]
          target_label: __param_ups

    - job_name: speedtest
      scrape_interval: 5m
      scrape_timeout: 180s
      static_configs:
        - targets:
            - speedtest-exporter.monitoring.svc.cluster.local:8080
          labels:
            instance: speedtest

    - job_name: tinytuya
      scrape_interval: 15s
      static_configs:
        - targets:
            - tinytuya-exporter.monitoring.svc.cluster.local:9123
          labels:
            instance: ups
        - targets:
            - tinytuya-exporter-desk.monitoring.svc.cluster.local:9123
          labels:
            instance: desk
        - targets:
            - tinytuya-exporter-refrigerator.monitoring.svc.cluster.local:9123
          labels:
            instance: refrigerator
        - targets:
            - tinytuya-exporter-washing-machine.monitoring.svc.cluster.local:9123
          labels:
            instance: washing-machine
        - targets:
            - tinytuya-exporter-bedside.monitoring.svc.cluster.local:9123
          labels:
            instance: bedside
        - targets:
            - tinytuya-exporter-entrance.monitoring.svc.cluster.local:9123
          labels:
            instance: entrance

    - job_name: blackbox_http
      metrics_path: /probe
      static_configs:
        - targets: ["http://192.168.20.254"]
          labels:
            instance: ix2215
            module: http_2xx
        - targets: ["http://epgstation.app-epgstation.svc.cluster.local:8888/api/version"]
          labels:
            instance: epgstation
            module: http_2xx
        - targets: ["http://mirakurun.app-mirakurun.svc.cluster.local:40772/api/version"]
          labels:
            instance: mirakurun
            module: http_2xx
        - targets: ["http://magic-mirror.app-magic-mirror.svc.cluster.local:8080"]
          labels:
            instance: magic-mirror
            module: http_2xx
        - targets: ["http://nextcloud.app-nextcloud.svc.cluster.local:80/status.php"]
          labels:
            instance: nextcloud
            module: nextcloud_status
        - targets: ["http://tnlastation.app-tnlastation.svc.cluster.local:8888/api/version"]
          labels:
            instance: tnlastation
            module: http_2xx
        - targets: ["http://coupon-manager-api.app-coupon-manager.svc.cluster.local:8080/health"]
          labels:
            instance: coupon-manager
            module: http_2xx
        - targets: ["http://192.168.20.133:8080/readyz"]
          labels:
            instance: loockit
            replica: x570
            module: http_2xx
            # Per-target timing; preserve the blackbox_http job/instance labels.
            __scrape_interval__: 15s
            __scrape_timeout__: 10s
        - targets: ["http://192.168.20.134:8080/readyz"]
          labels:
            instance: loockit
            replica: b550m
            module: http_2xx
            __scrape_interval__: 15s
            __scrape_timeout__: 10s
        - targets: ["https://192.168.0.132:11443"]
          labels:
            instance: unifi-os-server
            module: http_2xx_insecure
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [module]
          target_label: __param_module
        - action: labeldrop
          regex: module
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    - job_name: blackbox_tls
      metrics_path: /probe
      params:
        module: [tls_certificate]
      static_configs:
        - targets: ["192.168.20.137:10250"]
          labels: {instance: kubelet-controlplane-01}
        - targets: ["192.168.20.138:10250"]
          labels: {instance: kubelet-controlplane-02}
        - targets: ["192.168.20.139:10250"]
          labels: {instance: kubelet-controlplane-03}
        - targets: ["192.168.20.140:10250"]
          labels: {instance: kubelet-worker-01}
        - targets: ["192.168.20.141:10250"]
          labels: {instance: kubelet-worker-02}
        - targets: ["192.168.10.107:10250"]
          labels: {instance: kubelet-worker-03}
        - targets: ["192.168.10.109:10250"]
          labels: {instance: kubelet-worker-04}
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    - job_name: blackbox_dns
      metrics_path: /probe
      static_configs:
        - targets: ["192.168.20.201:53"]
          labels:
            instance: internal-dns
            module: dns_internal
        - targets: ["192.168.20.201:53"]
          labels:
            instance: external-dns
            module: dns_external
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [module]
          target_label: __param_module
        - action: labeldrop
          regex: module
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    - job_name: blackbox_api
      metrics_path: /probe
      params:
        module: [https_kubernetes_ready]
      static_configs:
        - targets: ["https://192.168.20.228:6443/readyz"]
          labels:
            instance: home-k8s-api
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    # Transport availability only; authenticated DB queries and NFS writes are separate checks.
    - job_name: blackbox_tcp
      metrics_path: /probe
      params:
        module: [tcp_connect]
      static_configs:
        - targets: ["mariadb.infra-db.svc.cluster.local:3306"]
          labels: {instance: mariadb}
        - targets: ["postgres.infra-db.svc.cluster.local:5432"]
          labels: {instance: postgres}
        - targets: ["nextcloud-redis.app-nextcloud.svc.cluster.local:6379"]
          labels: {instance: redis}
        - targets: ["192.168.20.191:2049"]
          labels: {instance: nas-01-nfs}
        - targets: ["192.168.20.192:2049"]
          labels: {instance: nas-02-nfs}
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    - job_name: blackbox_icmp
      metrics_path: /probe
      scrape_interval: 30s
      params:
        module: [icmp]
      static_configs:
        - targets: ["192.168.0.253"]
          labels: {instance: wifi-ap}
        - targets: ["192.168.0.252"]
          labels: {instance: us-8-60w}
        - targets: ["192.168.0.254"]
          labels:
            instance: ix2215
        - targets: ["192.168.0.115"]
          labels:
            instance: pve-x570
        - targets: ["192.168.0.119"]
          labels:
            instance: pve-b550m
        - targets: ["192.168.0.132"]
          labels:
            instance: unifi-os-server
        - targets: ["192.168.20.101"]
          labels:
            instance: dev-app-server
        - targets: ["192.168.20.135"]
          labels:
            instance: lb-01
        - targets: ["192.168.20.136"]
          labels:
            instance: lb-02
        - targets: ["192.168.20.191"]
          labels:
            instance: nas-01
        - targets: ["192.168.20.192"]
          labels:
            instance: nas-02
        - targets: ["192.168.20.228"]
          labels:
            instance: home-k8s-vip
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    # home-k8sノードの死活はKubernetes Node discoveryで自動検出する。
    - job_name: blackbox_icmp_kubernetes_nodes
      metrics_path: /probe
      scrape_interval: 30s
      params:
        module: [icmp]
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_address_InternalIP]
          target_label: __param_target
        - source_labels: [__meta_kubernetes_node_name]
          target_label: instance
          regex: (.+-talos)-home-pve-amd64
          replacement: $1
        - target_label: job
          replacement: blackbox_icmp
        - target_label: __address__
          replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
