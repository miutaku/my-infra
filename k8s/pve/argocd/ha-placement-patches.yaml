apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis-ha-haproxy
spec:
  template:
    spec:
      priorityClassName: argocd-management
      nodeSelector:
        kubernetes.io/os: linux
        node.miutaku/platform: pve
        node.miutaku/role: agent
      containers:
      - name: haproxy
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 512Mi
      affinity:
        podAntiAffinity:
          $patch: replace
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-redis-ha-haproxy
            topologyKey: topology.miutaku/proxmox-node
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
