apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      priorityClassName: argocd-management
      nodeSelector:
        kubernetes.io/os: linux
        node.miutaku/platform: pve
        node.miutaku/role: agent
      containers:
      - name: argocd-applicationset-controller
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 512Mi
---
