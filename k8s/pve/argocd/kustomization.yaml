apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.10/manifests/ha/install.yaml
- availability.yaml
- retired-redis.yaml
patches:
- path: argocd-cmd-params-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
- path: argocd-cm-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-cm
- path: ha-placement-patches.yaml
