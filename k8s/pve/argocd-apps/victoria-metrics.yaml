apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/miutaku/my-infra.git
    targetRevision: main
    path: k8s/pve/victoria-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Kubernetes defaults fields inside the restored StatefulSet's immutable
  # volumeClaimTemplate differently from Argo's normalized manifest.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: victoria-metrics
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
