apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-green
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/miutaku/my-infra.git
    targetRevision: main
    path: k8s/pve/victoria-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # The restored StatefulSet already owns a bound local-path claim. Kubernetes
  # defaults fields inside this immutable template differently from Argo's
  # normalized manifest; data-bearing claim changes must never be auto-applied.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: victoria-metrics
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
