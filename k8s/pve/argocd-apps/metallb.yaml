apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # MetalLB Helm chart
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: "0.14.9"
      helm:
        releaseName: metallb
        values: |
          # Talos 1.13 / kube-proxy nftables環境では、FRR speakerを全nodeへ
          # 配置すると同居nodeのClusterIP通信を阻害した。L2到達可能な
          # 専用worker 1台だけへ配置し、VIP広告経路を一意にする。
          speaker:
            nodeSelector:
              kubernetes.io/hostname: talos-4jt-93y
    # L2Advertisement / IPAddressPool の設定
    - repoURL: https://github.com/miutaku/my-infra.git
      targetRevision: main
      path: k8s/pve/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bgppeers.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
