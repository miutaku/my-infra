apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tnlastation-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    environment: staging
spec:
  project: default
  source:
    repoURL: https://github.com/miutaku/my-infra.git
    targetRevision: main
    path: k8s/pve/tnlastation-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: app-tnlastation-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
