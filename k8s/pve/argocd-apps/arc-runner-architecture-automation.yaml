# Private repository only. Account auth is kept in a namespace-scoped Secret;
# runner gets only an in-memory copy, helper gets only this Secret get/update.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-architecture-automation
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.9.3
    helm:
      releaseName: architecture-automation-codex
      values: |
        githubConfigUrl: https://github.com/miutaku/architecture-automation
        githubConfigSecret: github-automation-token-secret
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-systems-gha-rs-controller
        minRunners: 1
        maxRunners: 1
        template:
          spec:
            securityContext:
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            nodeSelector:
              kubernetes.io/arch: amd64
              kubernetes.io/os: linux
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                    - key: topology.miutaku/proxmox-node
                      operator: In
                      values:
                      - pve-x570
                - weight: 20
                  preference:
                    matchExpressions:
                    - key: topology.miutaku/proxmox-node
                      operator: In
                      values:
                      - pve-b550m
            containers:
            - name: runner
              image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
              command:
              - /home/runner/run.sh
              env:
              - name: RUNNER_TOOL_CACHE
                value: /opt/hostedtoolcache
              resources:
                requests:
                  cpu: 1000m
                  memory: 1Gi
                limits:
                  cpu: '2'
                  memory: 4Gi
              volumeMounts:
              - name: codex-auth
                mountPath: /home/runner/.codex
              - name: toolcache
                mountPath: /opt/hostedtoolcache
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
            volumes:
            - name: codex-auth
              emptyDir:
                medium: Memory
                sizeLimit: 128Mi
            - name: toolcache
              emptyDir: {}
            - name: auth-seed
              secret:
                secretName: codex-account-auth
                defaultMode: 288
            - name: persist-script
              configMap:
                name: codex-auth-persist
                defaultMode: 292
            - name: private-service-account
              projected:
                defaultMode: 288
                sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
            automountServiceAccountToken: false
            serviceAccountName: codex-auth-persist
            initContainers:
            - name: seed-account-auth
              image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
              command:
              - /bin/sh
              - -c
              args:
              - set -eu; umask 077; cp /seed/auth.json /state/auth.json; chmod 0600 /state/auth.json
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              volumeMounts:
              - name: auth-seed
                mountPath: /seed
                readOnly: true
              - name: codex-auth
                mountPath: /state
            - name: persist-account-auth
              restartPolicy: Always
              image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
              command:
              - /home/runner/externals/node20/bin/node
              - /scripts/persist-auth.mjs
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
              - name: codex-auth
                mountPath: /state
              - name: persist-script
                mountPath: /scripts
                readOnly: true
              - name: private-service-account
                mountPath: /var/run/private-service-account
                readOnly: true
          metadata:
            labels:
              architecture.miutaku/credential-runner: 'true'
        runnerScaleSetName: architecture-automation-codex
  destination:
    server: https://kubernetes.default.svc
    namespace: architecture-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
