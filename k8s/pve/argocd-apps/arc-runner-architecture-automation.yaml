# Credential-bearing runner: registered ONLY to the private automation repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-architecture-automation
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.9.3
    helm:
      releaseName: architecture-automation-codex
      values: "githubConfigUrl: https://github.com/miutaku/architecture-automation\n\
        githubConfigSecret: github-automation-token-secret\ncontrollerServiceAccount:\n\
        \  namespace: arc-systems\n  name: arc-systems-gha-rs-controller\nminRunners:\
        \ 1\nmaxRunners: 1\ntemplate:\n  spec:\n    securityContext:\n      fsGroup:\
        \ 1001\n      fsGroupChangePolicy: OnRootMismatch\n      seccompProfile:\n\
        \        type: RuntimeDefault\n    nodeSelector:\n      kubernetes.io/arch:\
        \ amd64\n      kubernetes.io/os: linux\n    affinity:\n      nodeAffinity:\n\
        \        preferredDuringSchedulingIgnoredDuringExecution:\n        - weight:\
        \ 100\n          preference:\n            matchExpressions:\n            -\
        \ key: topology.miutaku/proxmox-node\n              operator: In\n       \
        \       values:\n              - pve-x570\n        - weight: 20\n        \
        \  preference:\n            matchExpressions:\n            - key: topology.miutaku/proxmox-node\n\
        \              operator: In\n              values:\n              - pve-b550m\n\
        \    containers:\n    - name: runner\n      image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807\n\
        \      command:\n      - /home/runner/run.sh\n      env:\n      - name: RUNNER_TOOL_CACHE\n\
        \        value: /opt/hostedtoolcache\n      resources:\n        requests:\n\
        \          cpu: 1000m\n          memory: 1Gi\n        limits:\n          cpu:\
        \ '2'\n          memory: 4Gi\n      volumeMounts:\n      - name: codex-auth\n\
        \        mountPath: /home/runner/.codex\n      - name: toolcache\n       \
        \ mountPath: /opt/hostedtoolcache\n      securityContext:\n        allowPrivilegeEscalation:\
        \ false\n        capabilities:\n          drop:\n          - ALL\n    volumes:\n\
        \    - name: codex-auth\n      persistentVolumeClaim:\n        claimName:\
        \ codex-auth\n    - name: toolcache\n      emptyDir: {}\n    automountServiceAccountToken:\
        \ false\n  metadata:\n    labels:\n      architecture.miutaku/credential-runner:\
        \ 'true'\nrunnerScaleSetName: architecture-automation-codex\n"
  destination:
    server: https://kubernetes.default.svc
    namespace: architecture-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
