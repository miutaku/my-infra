# No OpenAI authentication: polls trusted source main branches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-architecture-reader
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.9.3
    helm:
      releaseName: architecture-automation-reader
      values: |
        githubConfigUrl: https://github.com/miutaku/architecture-automation
        githubConfigSecret: github-automation-token-secret
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-systems-gha-rs-controller
        minRunners: 0
        maxRunners: 1
        template:
          spec:
            securityContext:
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            nodeSelector:
              kubernetes.io/os: linux
            containers:
            - name: runner
              image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
              command:
              - /home/runner/run.sh
              env:
              - name: RUNNER_TOOL_CACHE
                value: /opt/hostedtoolcache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: '1'
                  memory: 1Gi
              volumeMounts:
              - name: toolcache
                mountPath: /opt/hostedtoolcache
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
            volumes:
            - name: toolcache
              emptyDir: {}
            automountServiceAccountToken: false
          metadata:
            labels:
              architecture.miutaku/source-reader: 'true'
        runnerScaleSetName: architecture-automation-reader
  destination:
    server: https://kubernetes.default.svc
    namespace: architecture-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
