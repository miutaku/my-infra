apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reventer-admin-prd
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.discord: ''
spec:
  project: reventer
  source:
    repoURL: git@github.com:miutaku/reventer.git
    targetRevision: main
    path: infrastructure/k8s/admin-prd
  destination:
    namespace: app-reventer-prd
    name: oke-stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: admin
    jsonPointers:
    - /spec/replicas
