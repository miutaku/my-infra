apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reventer-prd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    notifications.argoproj.io/subscribe.on-deployed.discord: ''
spec:
  project: reventer
  source:
    repoURL: git@github.com:miutaku/reventer.git
    targetRevision: main
    path: infrastructure/k8s/prd
  destination:
    name: oke-prd
    namespace: app-reventer-prd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: false
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    - PruneLast=true
  ignoreDifferences:
  - group: argoproj.io
    kind: Rollout
    name: backend
    jsonPointers:
    - /spec/replicas
  - group: argoproj.io
    kind: Rollout
    name: frontend
    jsonPointers:
    - /spec/replicas
