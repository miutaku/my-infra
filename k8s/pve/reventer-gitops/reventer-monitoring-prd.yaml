apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reventer-monitoring-prd
  namespace: argocd
spec:
  project: reventer
  source:
    repoURL: git@github.com:miutaku/reventer.git
    targetRevision: '>=1.0.0-0'
    path: infrastructure/k8s/monitoring-prd
  destination:
    name: oke-prd
    namespace: reventer-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
