apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-k8s-victoria-metrics-nfs
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  capacity: {storage: 20Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, timeo=600, retrans=3]
  nfs:
    server: 192.168.20.192
    path: /mnt/raid1_case/home-k8s-victoria-metrics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data-nfs
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 20Gi}}
  storageClassName: ""
  volumeName: home-k8s-victoria-metrics-nfs
---
