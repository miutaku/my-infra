apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nas-backup-credentials
  namespace: infra-backup
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: nas-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: OCI_NAMESPACE
      remoteRef:
        key: DB_BACKUP_OCI_NAMESPACE
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: DB_BACKUP_OCI_S3_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: DB_BACKUP_OCI_S3_SECRET_KEY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: NAS_BACKUP_RESTIC_PASSWORD
    - secretKey: NOTIFY_WEBHOOK
      remoteRef:
        key: MARIADB_BACKUP_NOTIFY_WEBHOOK
    - secretKey: CRITICAL_WEBHOOK
      remoteRef:
        key: MARIADB_BACKUP_CRITICAL_WEBHOOK
