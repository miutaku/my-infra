apiVersion: v1
kind: ConfigMap
metadata:
  name: nas-backup-script
  namespace: infra-backup
data:
  backup.sh: |
    #!/bin/sh
    set -eu

    export RESTIC_REPOSITORY="s3:https://${OCI_NAMESPACE}.compat.objectstorage.ap-tokyo-1.oraclecloud.com/db-backup/nas-restic"
    export RESTIC_CACHE_DIR=/cache
    export AWS_REGION=ap-tokyo-1
    export AWS_DEFAULT_REGION=ap-tokyo-1
    # DB logical dump用に約1 GBを予約し、20 GB無料枠へ余裕を持たせる。
    warn_bytes=14000000000
    stop_bytes=17000000000

    notify() {
      webhook="$1"
      content="$2"
      [ -z "${webhook}" ] && return 0
      wget -qO- --header='Content-Type: application/json' \
        --post-data="$(jq -nc --arg content "${content}" '{content:$content}')" "${webhook}" >/dev/null
    }

    if ! restic snapshots >/dev/null 2>&1; then
      restic init
    fi

    before_bytes="$(restic stats --mode raw-data --json latest 2>/dev/null | jq -r '.total_size // 0')"

    if [ "${before_bytes}" -ge "${stop_bytes}" ]; then
      notify "${CRITICAL_WEBHOOK}" "@here NASバックアップ停止: OCI Object Storage使用量 ${before_bytes} bytes (停止閾値 ${stop_bytes})"
      exit 1
    fi
    if [ "${before_bytes}" -ge "${warn_bytes}" ]; then
      notify "${CRITICAL_WEBHOOK}" "@here NASバックアップ容量警告: OCI Object Storage使用量 ${before_bytes} bytes (警告閾値 ${warn_bytes})"
    fi

    # DBのraw data directoryは稼働中には整合したfile backupにならないため対象外。
    # PostgreSQL/MariaDBは既存の日次logical dumpで保護する。録画実体も無料枠保護のため対象外。
    restic backup \
      --tag nas-02 \
      --host home-k8s \
      --exclude-caches \
      /source/nextcloud-html \
      /source/tnlastation \
      /source/tnlastation-staging \
      /source/thumbnail \
      /source/drop

    restic forget --tag nas-02 --keep-daily 7 --keep-weekly 4 --keep-monthly 3 --prune
    restic check

    after_bytes="$(restic stats --mode raw-data --json latest | jq -r '.total_size')"
    snapshot="$(restic snapshots --tag nas-02 --latest 1 --json | jq -r '.[0].short_id')"
    notify "${NOTIFY_WEBHOOK}" "NASバックアップ完了: snapshot=${snapshot}, restic=${after_bytes} bytes"

    if [ "${after_bytes}" -ge "${stop_bytes}" ]; then
      notify "${CRITICAL_WEBHOOK}" "@here NASバックアップ後にOCI停止閾値へ到達: ${after_bytes} bytes"
    elif [ "${after_bytes}" -ge "${warn_bytes}" ]; then
      notify "${CRITICAL_WEBHOOK}" "@here NASバックアップ後にOCI警告閾値へ到達: ${after_bytes} bytes"
    fi
