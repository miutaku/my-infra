apiVersion: batch/v1
kind: CronJob
metadata:
  name: nas-backup
  namespace: infra-backup
spec:
  schedule: "0 19 * * *" # 04:00 JST; DB logical backupの1時間後
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1
              command: ["/bin/sh", "/scripts/backup.sh"]
              envFrom:
                - secretRef:
                    name: nas-backup-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsUser: 0
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: cache, mountPath: /cache}
                - {name: tmp, mountPath: /tmp}
                - {name: nextcloud-html, mountPath: /source/nextcloud-html, readOnly: true}
                - {name: tnlastation, mountPath: /source/tnlastation, readOnly: true}
                - {name: tnlastation-staging, mountPath: /source/tnlastation-staging, readOnly: true}
                - {name: thumbnail, mountPath: /source/thumbnail, readOnly: true}
                - {name: drop, mountPath: /source/drop, readOnly: true}
          volumes:
            - name: scripts
              configMap:
                name: nas-backup-script
                defaultMode: 0555
            - name: cache
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: nextcloud-html
              nfs: {server: 192.168.20.192, path: /mnt/raid1_case/home-k8s-nextcloud-html, readOnly: true}
            - name: tnlastation
              nfs: {server: 192.168.20.192, path: /mnt/raid1_case/tnlastation, readOnly: true}
            - name: tnlastation-staging
              nfs: {server: 192.168.20.192, path: /mnt/raid1_case/tnlastation-staging, readOnly: true}
            - name: thumbnail
              nfs: {server: 192.168.20.192, path: /mnt/raid1_case/thumbnail, readOnly: true}
            - name: drop
              nfs: {server: 192.168.20.192, path: /mnt/raid1_case/drop, readOnly: true}
