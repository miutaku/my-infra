apiVersion: batch/v1
kind: CronJob
metadata:
  name: annict-rec-sync-tnlastation
  namespace: app-annict-rec-sync-tnlastation
spec:
  schedule: "10 18 * * *"  # 03:10 JST 相当 (UTC)。既存 annict-rec-sync と時間をずらし、Annict/scraper への同時アクセスを避ける。
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: annict-rec-sync-tnlastation
              image: ghcr.io/miutaku/annict-rec-sync:latest
              imagePullPolicy: Always
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: ANNICT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: annict-rec-sync-tnlastation-secrets
                      key: ANNICT_TOKEN
                - name: SCRAPER_BASE_URL
                  value: http://annict-scraper.app-annict-scraper.svc.cluster.local:8080
                - name: EPGSTATION_BASE_URL
                  value: http://backend.app-tnlastation.svc.cluster.local:8080
                - name: SUBSCRIBED_SERVICES
                  value: "dアニメストア,Amazon プライム・ビデオ,Netflix"
                - name: MATCH_TOLERANCE_SEC
                  value: "300"
                - name: CHANNEL_MAP_FILE
                  value: /config/channel-map.json
                # TNLAStation config の encode[].name と一致させる (空 = エンコードなし)。
                # TNLAStation には EPGStation 側の "H.265 (OCI Remote)" に相当する profile はなく、
                # ffmpeg-worker-encode が処理する "H.265" を使う。
                - name: ENCODE_MODE
                  value: "H.265"
                # エンコード完了後に元 TS を削除するか
                - name: ENCODE_DELETE_ORIGINAL
                  value: "true"
                # DRY_RUN=true でログのみ。実際に予約する場合は false。
                - name: DRY_RUN
                  value: "false"
              volumeMounts:
                - name: channel-map
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: "20m"
                  memory: "64Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
          volumes:
            - name: channel-map
              configMap:
                name: annict-rec-sync-tnlastation-channel-map
