# ServiceMonitor はこのリポジトリでは管理しない
serviceMonitor:
  enabled: false

# 既存のパケット焼き込みsystemd node_exporter(9100)とhostNetwork上で
# ポートが競合しないよう、RKE2ノード向けはこのDaemonSetだけ9101で listen する。
service:
  port: 9101
  targetPort: 9101

# hwmon は通常デフォルト有効だが明示し、Raspberry Pi の SoC 温度を公開する
# thermal_zone collector も有効にする。/sys は chart が /host/sys に mount する。
extraArgs:
  - --collector.hwmon
  - --collector.thermal_zone

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

tolerations:
  - effect: NoSchedule
    operator: Exists
  - key: CriticalAddonsOnly
    operator: Exists
