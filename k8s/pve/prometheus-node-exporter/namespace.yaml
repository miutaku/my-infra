apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter requires hostPID, hostNetwork and read-only hostPath mounts.
    # This namespace contains trusted infrastructure monitoring workloads only.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
