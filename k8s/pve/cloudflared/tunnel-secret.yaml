apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        # BSM シークレット名: CLOUDFLARE_HOME_K8S_TUNNEL_TOKEN
        # 値: terraform -chdir=terraform/cloudflare output -raw home_k8s_tunnel_token
        key: CLOUDFLARE_HOME_K8S_TUNNEL_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
