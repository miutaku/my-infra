apiVersion: v1
kind: Service
metadata:
  name: cloudflared-readiness
  namespace: cloudflared
spec:
  type: NodePort
  # 別ノードへ転送すると停止対象PVEを除外できないので、必ずLocal。
  externalTrafficPolicy: Local
  selector:
    app: cloudflared
  ports:
    - name: readiness
      port: 2000
      targetPort: metrics
      nodePort: 32000
