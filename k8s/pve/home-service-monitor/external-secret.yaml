{
  "apiVersion": "external-secrets.io/v1beta1",
  "kind": "ExternalSecret",
  "metadata": {
    "name": "home-monitor-access"
  },
  "spec": {
    "refreshInterval": "1h",
    "secretStoreRef": {
      "name": "bitwarden",
      "kind": "ClusterSecretStore"
    },
    "target": {
      "name": "home-monitor-access",
      "creationPolicy": "Owner"
    },
    "data": [
      {
        "secretKey": "access-client-id",
        "remoteRef": {
          "key": "HOME_MONITORING_CF_ACCESS_CLIENT_ID"
        }
      },
      {
        "secretKey": "access-client-secret",
        "remoteRef": {
          "key": "HOME_MONITORING_CF_ACCESS_CLIENT_SECRET"
        }
      }
    ]
  }
}
