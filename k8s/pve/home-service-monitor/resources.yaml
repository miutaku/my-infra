apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-service-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: home-service-monitor
rules:
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list]
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: home-service-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: home-service-monitor
subjects:
  - kind: ServiceAccount
    name: home-service-monitor
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-service-monitor
spec:
  replicas: 1
  selector:
    matchLabels: {app: home-service-monitor}
  template:
    metadata:
      labels: {app: home-service-monitor}
    spec:
      serviceAccountName: home-service-monitor
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: monitor
          image: ghcr.io/miutaku/home-service-monitor:main
          imagePullPolicy: Always
          ports:
            - {name: metrics, containerPort: 9810}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: '1', memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: certificates, mountPath: /certificates, readOnly: true}
      volumes:
        - name: certificates
          configMap: {name: home-monitor-server-certificates}
        - name: config
          configMap: {name: home-service-monitor-config}
        - name: credentials
          projected:
            sources:
              - secret: {name: home-monitor-access, optional: true}
              - secret: {name: home-monitor-nas-01, optional: true}
              - secret: {name: home-monitor-nas-02, optional: true}
              - secret: {name: home-monitor-pbs, optional: true}
              - secret: {name: home-monitor-databases, optional: true}
              - secret: {name: home-monitor-unifi, optional: true}
              - secret: {name: home-monitor-s3, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: home-service-monitor
spec:
  selector: {app: home-service-monitor}
  ports:
    - {name: metrics, port: 9810, targetPort: metrics}
