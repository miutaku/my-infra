apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinytuya-exporter-desk
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinytuya-exporter-desk
  template:
    metadata:
      labels:
        app: tinytuya-exporter-desk
    spec:
      containers:
        - name: exporter
          image: ghcr.io/miutaku/tinytuya-exporter:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9123
          env:
            - name: TUYA_DEVICE_NAME
              value: desk
            - name: TUYA_DEVICE_IP
              value: 192.168.40.233
            - name: TUYA_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: tinytuya-device
                  key: desk-device-id
            - name: TUYA_LOCAL_KEY
              valueFrom:
                secretKeyRef:
                  name: tinytuya-device
                  key: desk-local-key
            - name: TUYA_VERSION
              value: "3.5"
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: TUYA_REQUEST_UPDATEDPS
              value: "false"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tinytuya-exporter-desk
  namespace: monitoring
spec:
  selector:
    app: tinytuya-exporter-desk
  ports:
    - name: metrics
      port: 9123
      targetPort: metrics
---
