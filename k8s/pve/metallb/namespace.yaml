apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # MetalLB speaker requires hostNetwork and NET_ADMIN/NET_RAW.
    # Keep this exception scoped to the dedicated namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
