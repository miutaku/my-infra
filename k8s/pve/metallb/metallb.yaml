---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - home-k8s-address-pool
  nodeSelectors:
    # The VIP pool belongs to VLAN 20. Advertise it only from Proxmox
    # workers attached to that L2 segment, not from Raspberry Pi nodes on
    # VLAN 10.
    - matchExpressions:
        - key: topology.miutaku/proxmox-node
          operator: Exists
---
