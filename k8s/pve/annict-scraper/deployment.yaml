apiVersion: apps/v1
kind: Deployment
metadata:
  name: annict-scraper
  namespace: app-annict-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: annict-scraper
  template:
    metadata:
      labels:
        app: annict-scraper
    spec:
      tolerations:
        - key: workload.miutaku/arm64
          operator: Equal
          value: reviewed
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: hardware.miutaku/memory
                    operator: In
                    values: [2gb]
      containers:
        - name: annict-scraper
          image: ghcr.io/miutaku/annict-subscription-scraper:sha-b9568db
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ
              value: Asia/Tokyo
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
