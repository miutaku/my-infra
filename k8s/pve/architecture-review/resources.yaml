apiVersion: v1
kind: ConfigMap
metadata:
  name: architecture-review-nginx
  namespace: arc-runners
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /srv/reviews;
      autoindex off;
      add_header Cache-Control "private, no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy same-origin always;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location / { try_files $uri $uri/ =404; }
      location ~ /\. { deny all; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: architecture-review
  namespace: arc-runners
spec:
  replicas: 1
  selector:
    matchLabels: {app: architecture-review}
  template:
    metadata:
      labels: {app: architecture-review}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-review-storage
          image: ghcr.io/actions/actions-runner:latest
          command: [/bin/sh, -c]
          args:
            - 'set -eu; mkdir -p /cache/architecture-reviews; chown 1001:1001 /cache/architecture-reviews; chmod 0755 /cache/architecture-reviews'
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - {name: reviews, mountPath: /cache}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports: [{containerPort: 8080, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: reviews, mountPath: /srv/reviews, subPath: architecture-reviews, readOnly: true}
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: reviews
          persistentVolumeClaim: {claimName: arc-runner-reventer-cache}
        - name: config
          configMap: {name: architecture-review-nginx}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: architecture-review
  namespace: arc-runners
spec:
  selector: {app: architecture-review}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: architecture-review
  namespace: arc-runners
spec:
  podSelector:
    matchLabels: {app: architecture-review}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cloudflared}
          podSelector:
            matchLabels: {app: cloudflared}
      ports: [{protocol: TCP, port: 8080}]
