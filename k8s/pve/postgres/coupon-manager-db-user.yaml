# Keep the application credential in both namespaces without storing it in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coupon-manager-db-user
  namespace: infra-db
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: coupon-manager-db-user
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: COUPON_MANAGER_POSTGRES_PASSWORD
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-ensure-coupon-manager-db
  namespace: infra-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ensure-database
          image: postgres:18.6-alpine
          command:
            - sh
            - -ec
            - |
              until PGPASSWORD="${POSTGRES_ADMIN_PASSWORD}" psql \
                -h postgres.infra-db.svc.cluster.local \
                -U tnlastation -d tnlastation -c "SELECT 1" >/dev/null 2>&1; do
                sleep 5
              done

              PGPASSWORD="${POSTGRES_ADMIN_PASSWORD}" psql \
                -h postgres.infra-db.svc.cluster.local \
                -U tnlastation -d tnlastation \
                -v ON_ERROR_STOP=1 \
                --set=coupon_password="${COUPON_MANAGER_POSTGRES_PASSWORD}" <<'SQL'
              SELECT format('CREATE ROLE coupon_manager LOGIN PASSWORD %L', :'coupon_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'coupon_manager') \gexec
              SELECT format('ALTER ROLE coupon_manager WITH LOGIN PASSWORD %L', :'coupon_password') \gexec
              SELECT 'CREATE DATABASE coupons OWNER coupon_manager'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'coupons') \gexec
              ALTER DATABASE coupons OWNER TO coupon_manager;
              SQL

              PGPASSWORD="${COUPON_MANAGER_POSTGRES_PASSWORD}" psql \
                -h postgres.infra-db.svc.cluster.local \
                -U coupon_manager -d coupons -c "SELECT 1" >/dev/null
              echo "coupon-manager database credential verified"
          env:
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: COUPON_MANAGER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coupon-manager-db-user
                  key: POSTGRES_PASSWORD
