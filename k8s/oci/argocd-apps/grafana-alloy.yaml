apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-grafana-alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "0.12.0"
      helm:
        releaseName: grafana-alloy
        valueFiles:
          - $values/k8s/observability/alloy/values.yaml
    - repoURL: https://github.com/miutaku/my-infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/miutaku/my-infra.git
      targetRevision: main
      path: k8s/observability/alloy/overlays/stg
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
