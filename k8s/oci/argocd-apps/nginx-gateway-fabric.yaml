apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-nginx-gateway-fabric
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/nginx/charts/nginx-gateway-fabric
    chart: nginx-gateway-fabric
    targetRevision: "2.6.7"
    helm:
      releaseName: nginx-gateway-fabric
      valuesObject:
        nginxGateway:
          nodeSelector:
            kubernetes.io/arch: arm64
        nginx:
          replicas: 2
          service:
            type: LoadBalancer
            annotations:
              # OCI Always Free: 10Mbps flexible shape (旧ingress-nginxと同条件)
              service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
              service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
              service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
          nodeSelector:
            kubernetes.io/arch: arm64
          container:
            resources:
              requests:
                cpu: "100m"
                memory: "90Mi"
          pod:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: nginx-gateway-fabric
                        app.kubernetes.io/instance: nginx-gateway-fabric
          config:
            # 旧ingress-nginxの use-forwarded-headers + proxy-real-ip-cidr 相当
            rewriteClientIP:
              mode: XForwardedFor
              setIPRecursively: true
              trustedAddresses:
                - type: CIDR
                  value: "173.245.48.0/20"
                - type: CIDR
                  value: "103.21.244.0/22"
                - type: CIDR
                  value: "103.22.200.0/22"
                - type: CIDR
                  value: "103.31.4.0/22"
                - type: CIDR
                  value: "141.101.64.0/18"
                - type: CIDR
                  value: "108.162.192.0/18"
                - type: CIDR
                  value: "190.93.240.0/20"
                - type: CIDR
                  value: "188.114.96.0/20"
                - type: CIDR
                  value: "197.234.240.0/22"
                - type: CIDR
                  value: "198.41.128.0/17"
                - type: CIDR
                  value: "162.158.0.0/15"
                - type: CIDR
                  value: "104.16.0.0/13"
                - type: CIDR
                  value: "104.24.0.0/14"
                - type: CIDR
                  value: "172.64.0.0/13"
                - type: CIDR
                  value: "131.0.72.0/22"
        extraObjects:
          # chartにnginx用PDBのvaluesが無いため生マニフェストで追加
          - |
            apiVersion: policy/v1
            kind: PodDisruptionBudget
            metadata:
              name: nginx-gateway-fabric
              namespace: nginx-gateway
            spec:
              minAvailable: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: nginx-gateway-fabric
                  app.kubernetes.io/instance: nginx-gateway-fabric
  ignoreDifferences:
    # >262144-byte annotation cap; ArgoCD's own apply fails every sync
    # regardless of ServerSideApply/Replace. Installed once via
    # `kubectl apply --server-side`; ignored so ArgoCD stops retrying it.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: nginxproxies.gateway.nginx.org
      jsonPointers:
        - /spec
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
