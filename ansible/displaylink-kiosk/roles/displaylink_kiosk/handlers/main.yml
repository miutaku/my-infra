---
- name: Update dconf database
  ansible.builtin.command: dconf update
  changed_when: true

- name: Restart gdm
  ansible.builtin.systemd_service:
    name: gdm3
    state: restarted

- name: Reboot kiosk
  ansible.builtin.reboot:
    reboot_timeout: 900

- name: Restart Tuya light display
  ansible.builtin.systemd_service:
    name: tuya-light-display.service
    scope: user
    daemon_reload: true
    enabled: true
    state: restarted
  become_user: "{{ kiosk_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[kiosk_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[kiosk_user][1] }}/bus"
  when: tuya_light_sensor_enabled | bool
