---
- name: Install automatic update and reboot notification support
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - update-notifier-common
    state: present

- name: Configure daily automatic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Configure update sources and conditional automatic reboot
  ansible.builtin.template:
    src: auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/99dev-app-auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Create the automatic upgrade timer override directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Schedule automatic upgrades before the reboot window
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/schedule.conf
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ dev_auto_upgrade_time }}
      RandomizedDelaySec=15m
    owner: root
    group: root
    mode: "0644"
  register: dev_auto_upgrade_schedule

- name: Enable daily APT metadata refresh
  ansible.builtin.systemd_service:
    name: apt-daily.timer
    enabled: true
    state: started

- name: Enable the automatic upgrade timer
  ansible.builtin.systemd_service:
    name: apt-daily-upgrade.timer
    daemon_reload: "{{ dev_auto_upgrade_schedule.changed }}"
    enabled: true
    state: "{{ 'restarted' if dev_auto_upgrade_schedule.changed else 'started' }}"
