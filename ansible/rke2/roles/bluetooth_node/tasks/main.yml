---
- name: Install Bluetooth userspace
  ansible.builtin.apt:
    name:
      - bluez
      - rfkill
    state: present
    update_cache: true

- name: Unblock Bluetooth
  ansible.builtin.command:
    argv:
      - rfkill
      - unblock
      - bluetooth
  changed_when: false

- name: Enable and start Bluetooth
  ansible.builtin.service:
    name: bluetooth
    enabled: true
    state: started

- name: Set BlueZ AutoEnable so the adapter powers on after reboot
  community.general.ini_file:
    path: /etc/bluetooth/main.conf
    section: Policy
    option: AutoEnable
    value: "true"
    mode: "0644"
    owner: root
    group: root
  notify:
    - Restarted bluetooth service

- name: Disabled onboard WiFi (unused; RKE2 traffic is on eth0) to remove BLE/WiFi radio coexistence interference
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-wifi"
    insertafter: '^dtoverlay=dwc2$'
    state: present
  notify: Reboot to apply radio overlays

- name: Configure onboard Bluetooth state
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-bt"
    insertafter: '^dtoverlay=disable-wifi$'
    state: "{{ 'present' if disable_onboard_bluetooth | default(false) | bool else 'absent' }}"
  notify: Reboot to apply radio overlays
