---
- name: Install Bluetooth userspace
  ansible.builtin.apt:
    name:
      - bluez
      - rfkill
    state: present
    update_cache: true

- name: Raise the system D-Bus per-UID connection ceiling for BLE clients
  ansible.builtin.template:
    src: system-local.conf.j2
    dest: /etc/dbus-1/system-local.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reloaded system D-Bus configuration

- name: Create bluetooth service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/bluetooth.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep retrying BlueZ after transient D-Bus exhaustion
  ansible.builtin.template:
    src: restart.conf.j2
    dest: /etc/systemd/system/bluetooth.service.d/restart.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reloaded systemd configuration
    - Restarted bluetooth service

- name: Unblock Bluetooth
  ansible.builtin.command:
    argv:
      - rfkill
      - unblock
      - bluetooth
  changed_when: false

- name: Enable and start Bluetooth
  ansible.builtin.service:
    name: bluetooth
    enabled: true
    state: started

- name: Set BlueZ AutoEnable so the adapter powers on after reboot
  community.general.ini_file:
    path: /etc/bluetooth/main.conf
    section: Policy
    option: AutoEnable
    value: "true"
    mode: "0644"
    owner: root
    group: root
  notify:
    - Restarted bluetooth service

- name: Disabled onboard WiFi (unused; RKE2 traffic is on eth0) to remove BLE/WiFi radio coexistence interference
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-wifi"
    insertafter: '^dtoverlay=dwc2$'
    state: present
  notify: Reboot to apply radio overlays
  when: ansible_facts['architecture'] in ['aarch64', 'arm64']

- name: Configure onboard Bluetooth state
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-bt"
    insertafter: '^dtoverlay=disable-wifi$'
    state: "{{ 'present' if disable_onboard_bluetooth | default(false) | bool else 'absent' }}"
  notify: Reboot to apply radio overlays
  when: ansible_facts['architecture'] in ['aarch64', 'arm64']
