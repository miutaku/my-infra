---
- name: Reloaded system D-Bus configuration
  ansible.builtin.command:
    argv:
      - busctl
      - call
      - org.freedesktop.DBus
      - /
      - org.freedesktop.DBus
      - ReloadConfig
  changed_when: true

- name: Reloaded systemd configuration
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restarted bluetooth service
  ansible.builtin.service:
    name: bluetooth
    state: restarted

- name: Reboot to apply radio overlays
  ansible.builtin.reboot:
    reboot_timeout: 180
