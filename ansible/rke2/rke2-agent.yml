---
- name: Get RKE2 server token for agent nodes
  hosts: rke2-server-primary
  strategy: debug
  gather_facts: true
  become: true
  vars:
    ansible_user: miutaku
  tasks:
    - name: Read RKE2 server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/token
      register: rke2_token_raw
      tags: rke2_agent_node
      when: not ansible_check_mode
      no_log: true

    - name: Set dummy token
      ansible.builtin.set_fact:
        rke2_token_raw:
          content: "{{ 'dummy_token' | b64encode }}"
      when: ansible_check_mode
      no_log: true

    - name: Set token fact for all hosts
      ansible.builtin.set_fact:
        rke2_node_token: "{{ rke2_token_raw.content | b64decode }}"
      delegate_to: localhost
      tags: rke2_agent_node
      no_log: true

    - name: Add token fact to all agent hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: rke2-agent
        rke2_node_token: "{{ rke2_token_raw.content | b64decode }}"
      loop: "{{ groups['rke2-agent'] + groups['rke2-dvb-worker'] }}"
      changed_when: false
      tags: rke2_agent_node
      no_log: true

- name: Configure RKE2 Agent Nodes
  hosts: rke2-agent
  strategy: debug
  gather_facts: true
  become: true
  vars:
    ansible_user: miutaku
    rke2_node_token: "{{ hostvars[inventory_hostname].rke2_node_token }}"
  roles:
    - role: common
      tags: common
    - role: sysctl
      tags: sysctl
    - role: bluetooth_node
      when: bluetooth_controller | default(false) | bool
      tags: bluetooth_node

# Separate play so any reboot handler notified by bluetooth_node (disable-wifi
# overlay) flushes here, before rke2_agent_node runs — matching the previous
# inline `reboot` task's position. `roles:` entries cannot contain a bare
# `meta: flush_handlers` step, so the play boundary is used instead.
- name: Configure RKE2 Agent Nodes (post-reboot)
  hosts: rke2-agent
  strategy: debug
  gather_facts: false
  become: true
  vars:
    ansible_user: miutaku
    rke2_node_token: "{{ hostvars[inventory_hostname].rke2_node_token }}"
  roles:
    - role: cpu_frequency
      when: cpu_frequency_max_khz is defined
      tags: cpu_frequency
    - role: rke2_agent_node
      tags: rke2_agent_node
    - role: rke2_all_node
      tags: rke2_all_node

- name: Apply Kubernetes-managed labels to RKE2 Agent Nodes
  hosts: rke2-server-primary
  gather_facts: false
  become: true
  vars:
    ansible_user: miutaku
  tasks:
    - name: Apply agent role and hostname compatibility labels
      ansible.builtin.command:
        argv: >-
          {{
            [
              '/var/lib/rancher/rke2/bin/kubectl',
              '--kubeconfig',
              '/etc/rancher/rke2/rke2.yaml',
              'label',
              'node',
              hostvars[item].hostname,
              'node-role.kubernetes.io/agent=true',
              '--overwrite'
            ]
            + (
              ['kubernetes.io/hostname=' + hostvars[item].kubernetes_hostname_compat]
              if hostvars[item].kubernetes_hostname_compat is defined
              else []
            )
          }}
      loop: "{{ groups['rke2-agent'] + groups['rke2-dvb-worker'] }}"
      register: rke2_agent_label_result
      changed_when: "'not labeled' not in rke2_agent_label_result.stdout"
      tags: rke2_agent_labels

- name: Configure DVB Worker Node (PT3 driver + RKE2 agent)
  hosts: rke2-dvb-worker
  strategy: debug
  gather_facts: true
  become: true
  vars:
    ansible_user: miutaku
    rke2_node_token: "{{ hostvars[inventory_hostname].rke2_node_token }}"
  roles:
    - role: common
      tags: common
    - role: sysctl
      tags: sysctl
    - role: dvb_node
      tags: dvb_node
    - role: rke2_agent_node
      tags: rke2_agent_node
    - role: rke2_all_node
      tags: rke2_all_node

- name: Finalized
  hosts: rke2-agent:rke2-dvb-worker
  gather_facts: false
  become: true
  vars:
    ansible_user: miutaku
    rke2_node_token: "{{ hostvars[inventory_hostname].rke2_node_token }}"
  roles:
    - role: auto_update
      tags: auto_update
