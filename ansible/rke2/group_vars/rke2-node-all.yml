---
# Desired RKE2 production version. Updated by rke2_version_watch.yml.
rke2_version: "v1.36.4+rke2r1"

# kubectl context used by rke2-upgrade.yml to query/drain/cordon nodes.
rke2_kube_context: rke2-pve

kernel_modules:
  - br_netfilter
sysctl_settings:
  - net.ipv4.ip_nonlocal_bind
  - net.ipv4.ip_forward
  - net.bridge.bridge-nf-call-iptables
  - net.bridge.bridge-nf-call-ip6tables
  - net.bridge.bridge-nf-call-arptables
