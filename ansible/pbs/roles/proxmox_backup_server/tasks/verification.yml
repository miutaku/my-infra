---
- name: Read existing PBS verification jobs
  ansible.builtin.command:
    argv: [proxmox-backup-manager, verify-job, list, --output-format, json]
  register: pbs_verification_jobs
  changed_when: false
  check_mode: false

- name: Select the managed PBS verification job
  ansible.builtin.set_fact:
    pbs_verification_job: "{{ (pbs_verification_jobs.stdout | from_json | selectattr('id', 'eq', pbs.datastore_name ~ '-verify') | list | first) | default({}) }}"

- name: Determine whether PBS verification settings differ
  ansible.builtin.set_fact:
    pbs_verification_changed: >-
      {{ pbs_verification_job.get('store') != pbs.datastore_name
         or pbs_verification_job.get('schedule') != pbs.verify_schedule
         or pbs_verification_job.get('ignore-verified', true) != true
         or pbs_verification_job.get('outdated-after') != pbs.verify_outdated_after
         or pbs_verification_job.get('read-threads', 1) != pbs.verify_read_threads
         or pbs_verification_job.get('verify-threads', 4) != pbs.verify_threads }}

- name: Report planned PBS verification update
  ansible.builtin.debug:
    msg: "Configure {{ pbs.datastore_name }}-verify at {{ pbs.verify_schedule }} Asia/Tokyo"
  when: ansible_check_mode and pbs_verification_changed
  changed_when: true

- name: Ensure the PBS verification job
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - verify-job
      - "{{ 'update' if pbs_verification_job else 'create' }}"
      - "{{ pbs.datastore_name }}-verify"
      - --store
      - "{{ pbs.datastore_name }}"
      - --schedule
      - "{{ pbs.verify_schedule }}"
      - --ignore-verified
      - 'true'
      - --outdated-after
      - "{{ pbs.verify_outdated_after | string }}"
      - --read-threads
      - "{{ pbs.verify_read_threads | string }}"
      - --verify-threads
      - "{{ pbs.verify_threads | string }}"
  when: not ansible_check_mode and pbs_verification_changed
  changed_when: true
