---
- name: Configure and deploy Loockit LXC
  hosts: loockit_hosts
  become: true
  gather_facts: false
  vars:
    loockit_image: "{{ lookup('file', 'image.env').split('=', 1)[1] }}"
  tasks:
    - name: Install host Bluetooth and D-Bus proxy packages
      ansible.builtin.apt:
        name:
          - bluez
          - xdg-dbus-proxy
        state: present
        update_cache: true

    - name: Install filtered BlueZ D-Bus proxy unit
      ansible.builtin.copy:
        src: loockit-dbus-proxy.service
        dest: /etc/systemd/system/loockit-dbus-proxy.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Loockit D-Bus proxy

    - name: Enable host Bluetooth and proxy
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - bluetooth.service
        - loockit-dbus-proxy.service

    - name: Apply proxy unit changes before container validation
      ansible.builtin.meta: flush_handlers

    - name: Bind filtered D-Bus socket directory into LXC
      ansible.builtin.command:
        argv:
          - pct
          - set
          - "{{ loockit_ct_id | string }}"
          - -mp0
          - /run/loockit-dbus,mp=/mnt/host-dbus,ro=1
      changed_when: true

    - name: Install Docker inside LXC
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ loockit_ct_id | string }}"
          - --
          - bash
          - -ec
          - >-
            command -v docker >/dev/null ||
            (apt-get update -qq && DEBIAN_FRONTEND=noninteractive
            apt-get install -y -qq docker.io ca-certificates curl)
      changed_when: true

    - name: Create Kubernetes service account directory in LXC
      ansible.builtin.command:
        argv: [pct, exec, "{{ loockit_ct_id | string }}", --, install, -d, -m, "0700", /etc/loockit/kubernetes]
      changed_when: true

    - name: Stage Kubernetes service account files on Proxmox host
      ansible.builtin.copy:
        src: "{{ lookup('env', 'LOOCKIT_KUBE_SA_DIR') }}/{{ item }}"
        dest: "/run/loockit-kube-{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop: [token, ca.crt, namespace]
      no_log: true

    - name: Copy Kubernetes service account files into LXC
      ansible.builtin.command:
        argv: [pct, push, "{{ loockit_ct_id | string }}", "/run/loockit-kube-{{ item }}", "/etc/loockit/kubernetes/{{ item }}", --perms, "0600"]
      loop: [token, ca.crt, namespace]
      no_log: true
      changed_when: true

    - name: Stage Loockit configuration on Proxmox host
      ansible.builtin.copy:
        src: config.toml
        dest: /run/loockit-config.toml
        owner: root
        group: root
        mode: "0644"

    - name: Copy Loockit configuration into LXC
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ loockit_ct_id | string }}"
          - /run/loockit-config.toml
          - /etc/loockit/config.toml
          - --perms
          - "0644"
      changed_when: true

    - name: Stage Loockit secrets on Proxmox host
      ansible.builtin.copy:
        src: "{{ lookup('env', 'LOOCKIT_SECRET_ENV_FILE') }}"
        dest: /run/loockit.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Copy Loockit secrets into LXC
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ loockit_ct_id | string }}"
          - /run/loockit.env
          - /etc/loockit/loockit.env
          - --perms
          - "0600"
      no_log: true
      changed_when: true

    - name: Install rollback-capable deploy script
      ansible.builtin.copy:
        src: deploy-container.sh
        dest: /usr/local/sbin/deploy-loockit-lxc
        owner: root
        group: root
        mode: "0755"

    - name: Deploy pinned Loockit image
      ansible.builtin.command: /usr/local/sbin/deploy-loockit-lxc
      environment:
        LOOCKIT_CT_ID: "{{ loockit_ct_id | string }}"
        LOOCKIT_IMAGE: "{{ loockit_image }}"
        LOOCKIT_ADDRESS: "{{ loockit_address }}"
        LOOCKIT_IDENTITY: "{{ loockit_identity }}"
      register: deploy_result
      changed_when: "'is ready' in deploy_result.stdout"

    - name: Remove staged secret
      ansible.builtin.file:
        path: /run/loockit.env
        state: absent

    - name: Remove staged Kubernetes service account files
      ansible.builtin.file:
        path: "/run/loockit-kube-{{ item }}"
        state: absent
      loop: [token, ca.crt, namespace]
      no_log: true

  handlers:
    - name: Restart Loockit D-Bus proxy
      ansible.builtin.systemd_service:
        name: loockit-dbus-proxy.service
        state: restarted
        daemon_reload: true
