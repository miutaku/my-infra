global
  log stdout format raw local0
  nbthread 1
defaults
  log global
  mode http
  timeout connect 3s
  timeout client 65s
  timeout server 65s
frontend loockit_rest
  bind 127.0.0.1:18080
  default_backend loockit_rest
backend loockit_rest
  option httpchk GET /readyz
  http-check expect status 200
  # Never replay a door operation onto another backend after a response loss.
  retries 0
  server x570 192.168.20.133:8080 check inter 2s fall 2 rise 2
  server b550m 192.168.20.134:8080 check inter 2s fall 2 rise 2
