name: Mirakurun runtime check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: talos-infra-admin
    timeout-minutes: 5
    steps:
      - name: Check production and staging runtime
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for host in 192.168.20.132 192.168.20.142; do
            echo "Mirakurun host: $host"
            if ! curl -fsS --connect-timeout 5 --max-time 15 "http://$host:40772/api/status" |
              jq '{version,process:{arch:.process.arch,platform:.process.platform,versions:.process.versions},errorCount,timerAccuracy}'; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Check configured Ansible SSH access
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for target in miutaku@192.168.0.115 root@192.168.0.119; do
            echo "Checking existing SSH access: $target"
            ssh -o BatchMode=yes -o ConnectTimeout=5 -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="${RUNNER_TEMP}/mirakurun-known-hosts" \
              "$target" 'id -un' || true
          done
