name: 'encode-worker image'

on:
  push:
    branches: [main]
    paths:
      - 'docker/encode-worker/**'
  pull_request:
    branches: [main]
    paths:
      - 'docker/encode-worker/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/encode-worker

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (ARM64 cross-build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/encode-worker
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Kustomize
        if: github.event_name == 'push'
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Bump image tag and commit (GitOps)
        if: github.event_name == 'push'
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA:0:7}"
          cd k8s/oci/apps/encode-worker
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/oci/apps/encode-worker/kustomization.yaml
          if git diff --staged --quiet; then
            echo "image tag unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(encode-worker): deploy image $TAG"

          # main は required_signatures / required_status_checks ルールセットで
          # 保護されているが、Admin ロールは常にバイパスできる。GITHUB_TOKEN には
          # Admin 権限がないため、BSM に登録した Admin 権限 PAT で push する。
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-gnu-2.0.0.zip" -o /tmp/bws.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/bws.zip').extract('bws', '$HOME/bin/')"
          chmod +x "$HOME/bin/bws"
          GITOPS_PAT=$("$HOME/bin/bws" secret list | python3 -c 'import sys, json; data=json.load(sys.stdin); print(next((item.get("value") for item in data if item.get("key")=="my-infra-gitops-push"), ""))')
          if [ -z "$GITOPS_PAT" ]; then
            echo 'BSM secret my-infra-gitops-push was not found or is empty' >&2
            exit 1
          fi
          echo "::add-mask::$GITOPS_PAT"

          git remote set-url origin "https://x-access-token:${GITOPS_PAT}@github.com/${{ github.repository }}.git"
          git pull --rebase --autostash
          git push
