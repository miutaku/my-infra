name: 'Packer CI'

on:
  push:
    branches: ['**']
    paths:
      - 'packer/**'
  pull_request:
    branches: [main]
    paths:
      - 'packer/**'

jobs:
  validate:
    name: 'Validate (${{ matrix.template }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - template: ubuntu-26-04
            extra_vars: >-
              -var "proxmox_token_id=ci"
              -var "proxmox_token_secret=ci"
              -var "ssh_password=ci"
              -var "ssh_password_hash=$6$ci"
          - template: debian-13
            extra_vars: >-
              -var "proxmox_token_id=ci"
              -var "proxmox_token_secret=ci"
              -var "ssh_password=ci"
              -var "ssh_password_hash=$6$ci"
          - template: truenas-scale
            extra_vars: >-
              -var "proxmox_token_id=ci"
              -var "proxmox_token_secret=ci"
              -var "admin_password=ci"
    defaults:
      run:
        working-directory: packer/${{ matrix.template }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3

      - name: packer init
        run: packer init .

      - name: packer validate
        run: packer validate ${{ matrix.extra_vars }} .
