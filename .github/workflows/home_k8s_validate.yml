name: home-k8s validation

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: home-k8s-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate shell and Terraform formatting
        run: |
          bash -n scripts/setup-kubeconfig
          terraform fmt -check -recursive

      - name: Reject legacy platform names in active home-k8s configuration
        run: |
          if git grep -n -i rke2 -- \
            k8s/pve k8s/oci terraform/cloudflare scripts/setup-kubeconfig talos/green/README.md \
            ':!terraform/cloudflare/migrations.tf'; then
            echo 'Legacy RKE2 naming remains in active home-k8s configuration.' >&2
            exit 1
          fi

      - name: Validate changed YAML syntax
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.yaml' '*.yml')
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_stream(File.read(f)) }' "${files[@]}"
