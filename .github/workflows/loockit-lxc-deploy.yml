name: Loockit LXC deploy

on:
  push:
    branches: [main]
    paths:
      - ansible/loockit-lxc/**
  workflow_dispatch:

concurrency:
  group: loockit-lxc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: talos-infra-admin
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install deployment tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq unzip
          curl -fsSL https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-gnu-2.0.0.zip -o "${RUNNER_TEMP}/bws.zip"
          unzip -q "${RUNNER_TEMP}/bws.zip" bws -d "${RUNNER_TEMP}/bin"
          chmod +x "${RUNNER_TEMP}/bin/bws"

      - name: Materialize short-lived deployment credentials
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.GH_MY_INFRA_BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          secret_value() {
            bws secret list | jq -er --arg key "$1" '.[] | select(.key == $key) | .value'
          }
          key_file="${RUNNER_TEMP}/loockit-deploy-key"
          umask 077
          secret_value LOOCKIT_LXC_DEPLOY_SSH_PRIVATE_KEY_B64 | base64 --decode > "$key_file"
          chmod 0600 "$key_file"
          echo "LOOCKIT_DEPLOY_KEY=${key_file}" >> "$GITHUB_ENV"

      - name: Deploy with health-check and rollback
        run: |
          set -euo pipefail
          image="$(cut -d= -f2 ansible/loockit-lxc/image.env)"
          # Update the standby first so the active BLE controller is not
          # interrupted until a current fallback is available.
          if curl -fsS --max-time 5 http://192.168.20.133:8080/readyz >/dev/null; then
            hosts=(192.168.20.134 192.168.20.133)
          else
            hosts=(192.168.20.133 192.168.20.134)
          fi
          for host in "${hosts[@]}"; do
            ssh -i "$LOOCKIT_DEPLOY_KEY" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "loockit-deploy@${host}" "deploy ${image}"
          done
          for attempt in $(seq 1 48); do
            if curl -fsS --max-time 5 \
              http://loockit.app-loockit.svc.cluster.local:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo 'Loockit HA service did not recover within 240 seconds' >&2
          exit 1
