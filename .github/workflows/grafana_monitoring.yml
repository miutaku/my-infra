name: Grafana monitoring CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/grafana-cloud/**
      - scripts/test-grafana-monitoring.py
      - scripts/check-grafana-monitoring.py
      - scripts/grafana-monitoring.py
      - scripts/grafana-notifications.py
      - scripts/test-grafana-notifications.py
      - scripts/check-grafana-notification-plan.py
      - scripts/deploy-grafana-monitoring.py
      - scripts/test-deploy-grafana-monitoring.py
      - .github/workflows/grafana_monitoring.yml
      - k8s/pve/vmagent/**
      - k8s/pve/blackbox-exporter/**
      - k8s/pve/kube-state-metrics/**
      - k8s/pve/argocd-apps/kube-state-metrics.yaml
      - k8s/pve/home-service-monitor/**
      - docker/home-service-monitor/**
      - docker/home-backup-tools/**
      - scripts/test-home-backup-restore.py
      - k8s/pve/nas-backup/**
      - k8s/pve/mariadb/backup-scripts-configmap.yaml
      - scripts/report-backup-restore.py
      - ansible/truenas/**
  push:
    branches: [main]
    paths:
      - terraform/grafana-cloud/**
      - scripts/test-grafana-monitoring.py
      - scripts/check-grafana-monitoring.py
      - scripts/grafana-monitoring.py
      - scripts/grafana-notifications.py
      - scripts/test-grafana-notifications.py
      - scripts/check-grafana-notification-plan.py
      - scripts/deploy-grafana-monitoring.py
      - scripts/test-deploy-grafana-monitoring.py
      - .github/workflows/grafana_monitoring.yml
      - k8s/pve/vmagent/**
      - k8s/pve/blackbox-exporter/**
      - k8s/pve/kube-state-metrics/**
      - k8s/pve/argocd-apps/kube-state-metrics.yaml
      - k8s/pve/home-service-monitor/**
      - docker/home-service-monitor/**
      - docker/home-backup-tools/**
      - scripts/test-home-backup-restore.py
      - k8s/pve/nas-backup/**
      - k8s/pve/mariadb/backup-scripts-configmap.yaml
      - scripts/report-backup-restore.py
      - ansible/truenas/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - name: Terraform checks (no credentials or apply)
        working-directory: terraform/grafana-cloud
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
      - name: Notification updater safety (no credentials or sends)
        run: |
          python3 scripts/test-grafana-notifications.py
          python3 scripts/test-deploy-grafana-monitoring.py
      - name: Install pinned Prometheus test tools
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/prometheus.tar.gz"
          echo "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" prometheus-3.15.0.linux-amd64/promtool
      - name: Functional collector behavior checks
        run: |
          python3 -m unittest discover -s docker/home-service-monitor -v
          python3 -m unittest discover -s ansible/truenas/tests -v
      - name: Build backup test tools
        run: docker build -t my-infra-home-backup-tools:check docker/home-backup-tools
      - name: Isolated database and restic restore checks
        run: python3 scripts/test-home-backup-restore.py
      - name: PromQL and alert behavior checks
        run: python3 scripts/test-grafana-monitoring.py --promtool "$RUNNER_TEMP/prometheus-3.15.0.linux-amd64/promtool"
      - name: Render Kubernetes resources
        run: |
          kubectl kustomize k8s/pve/kube-state-metrics > "$RUNNER_TEMP/kube-state-metrics.yaml"
          kubectl kustomize k8s/pve/home-service-monitor > "$RUNNER_TEMP/home-service-monitor.yaml"
          kubectl kustomize k8s/pve/nas-backup > "$RUNNER_TEMP/nas-backup.yaml"


  apply:
    name: Apply Grafana Cloud
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: grafana-cloud-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Install pinned Bitwarden Secrets Manager CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-gnu-2.0.0.zip \
            --output "$RUNNER_TEMP/bws.zip"
          echo "a8340ce01da609200441f2eca0e591173e124f012c88a16afda574279c052013  $RUNNER_TEMP/bws.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bws-bin"
          unzip -q "$RUNNER_TEMP/bws.zip" -d "$RUNNER_TEMP/bws-bin"
          chmod +x "$RUNNER_TEMP/bws-bin/bws"
          echo "$RUNNER_TEMP/bws-bin" >> "$GITHUB_PATH"
      - name: Plan, apply and verify Grafana Cloud
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.GH_MY_INFRA_BWS_ACCESS_TOKEN }}
        run: python3 scripts/deploy-grafana-monitoring.py --apply
