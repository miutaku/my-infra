name: 'workflow security guard'

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forbid secret-exposing trigger patterns
        run: |
          set -euo pipefail
          if grep -rln --exclude='guard-secrets.yml' -E '^\s*pull_request_target\s*:|^\s*workflow_run\s*:' .github/workflows/; then
            echo "::error::pull_request_target / workflow_run はフォークPRのコードにSecretsを露出させる典型的な脆弱パターンです。上記ファイルで検出されました。意図的な場合もレビューを必須にしてください。"
            exit 1
          fi
          echo "OK: 危険なトリガーは見つかりませんでした"
